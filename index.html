<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 - EL PEZ OFICIAL</title>
<style>
  body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}
  h1{color:#FFD700;cursor:pointer;user-select:none}
  .upload{border:2px dashed #FFD700;padding:15px;border-radius:15px;margin:20px auto;max-width:500px;background:#1a1a1a}
  input{margin:8px;width:90%;padding:10px;border-radius:10px;border:none}
  button{background:#FFD700;color:#000;font-weight:bold;padding:12px 20px;border:none;border-radius:30px;cursor:pointer;margin:5px}
  .tema{background:#1e1e1e;padding:15px;border-radius:15px;margin:15px auto;max-width:500px;display:flex;gap:15px;align-items:center;text-align:left}
  .tema img{width:80px;height:80px;border-radius:10px;object-fit:cover;background:#333}
  .info{flex:1}
  .info b{display:block;margin-bottom:5px;color:#FFD700}
  audio{width:100%;margin-top:8px}
  .del{background:#ff3b3b;color:#fff;display:none}
  .admin-on .del{display:inline-block}
  #adminBadge{display:none;background:#00ff88;color:#000;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
</head>
<body id="body">

<h1 id="logo">EL DON 2035 EL PEZ OFICIAL 🐟</h1>
<span id="adminBadge">MODO ADMIN ACTIVO</span>
<p>Tus Temas (<span id="contador">0</span>)</p>

<div class="upload">
  <h3 style="color:#FFD700">SUBIR TU MÚSICA REAL</h3>
  <input type="text" id="titulo" placeholder="Título: Ej La Chaparrita de la Casa">
  <input type="file" id="mp3" accept="audio/*">
  <input type="file" id="portada" accept="image/*">
  <br>
  <button onclick="subirTema()">SUBIR DE VERDAD</button>
  <p id="msg" style="color:#00ff88"></p>
</div>

<div id="lista"></div>

<script>
// TEMAS INICIALES
let temas = JSON.parse(localStorage.getItem('temas_pez')) || '[]');
if(temas.length===0){
  temas = [
    {titulo:"Mi Conchita", cover:"", audio:""},
    {titulo:"Hija de mi vida", cover:"", audio:""},
    {titulo:"Sali de la disco enamorado", cover:"", audio:""}
  ];
}

const listaDiv = document.getElementById('lista');
const contador = document.getElementById('contador');

function render(){
  listaDiv.innerHTML="";
  temas.forEach((t,i)=>{
    listaDiv.innerHTML+=`
    <div class="tema">
      <img src="${t.cover || 'https://via.placeholder.com/80/FFD700/000?text=EL+PEZ'}">
      <div class="info">
        <b>${t.titulo}</b>
        <audio controls src="${t.audio}" data-index="${i}"></audio>
        <br>
        <button onclick="compartir('${t.titulo}')">WhatsApp</button>
        <button class="del" onclick="borrar(${i})">Borrar</button>
      </div>
    </div>`;
  });
  contador.textContent=temas.length;
  activarAutoplay();
}

function activarAutoplay(){
  const audios = document.querySelectorAll('audio');
  audios.forEach((audio,i)=>{
    audio.onended = ()=>{
      const siguiente = audios[i+1];
      if(siguiente){
        siguiente.play();
        siguiente.scrollIntoView({behavior:'smooth',block:'center'});
      }
    };
    audio.onplay = ()=>{
      audios.forEach(otro=>{ if(otro!==audio) otro.pause(); });
    };
  });
}

function subirTema(){
  const titulo = document.getElementById('titulo').value.trim();
  const fileMp3 = document.getElementById('mp3').files[0];
  const fileCover = document.getElementById('portada').files[0];
  if(!titulo || !fileMp3){ alert("Pon título y mp3 mi pez"); return; }

  const readerMp3 = new FileReader();
  readerMp3.onload = (eMp3)=>{
    if(fileCover){
      const readerCover = new FileReader();
      readerCover.onload = (eCover)=>{
        temas.push({titulo:titulo, audio:eMp3.target.result, cover:eCover.target.result});
        guardar();
      };
      readerCover.readAsDataURL(fileCover);
    }else{
      temas.push({titulo:titulo, audio:eMp3.target.result, cover:""});
      guardar();
    }
  };
  readerMp3.readAsDataURL(fileMp3);
}

function guardar(){
  localStorage.setItem('temas_pez', JSON.stringify(temas));
  document.getElementById('msg').textContent="¡Subidos sin cortar la música mi pez! ✅";
  document.getElementById('titulo').value="";
  document.getElementById('mp3').value="";
  document.getElementById('portada').value="";
  render();
}

function borrar(i){
  if(!document.body.classList.contains('admin-on')) return;
  if(confirm("¿Borrar "+temas[i].titulo+" ?")){
    temas.splice(i,1);
    localStorage.setItem('temas_pez', JSON.stringify(temas));
    render();
  }
}
function compartir(t){ window.open(`https://wa.me/?text=Escucha ${t} de EL DON 2035 EL PEZ OFICIAL - https://eldon2035.github.io/elpez/`); }

// ADMIN 5 TOQUES
let toques=0;
document.getElementById('logo').addEventListener('click',()=>{
  toques++;
  if(toques>=5){
    const pass=prompt("Clave admin mi pez:");
    if(pass==="Elpez2035"){
      document.body.classList.add('admin-on');
      document.getElementById('adminBadge').style.display="inline-block";
      localStorage.setItem('pez_admin','1');
      alert("Modo admin activado");
      render();
    }
    toques=0;
  }
  setTimeout(()=>toques=0,3000);
});
if(localStorage.getItem('pez_admin')==="1"){
  document.body.classList.add('admin-on');
  document.getElementById('adminBadge').style.display="inline-block";
}

render();
</script>
</body>
</html>
