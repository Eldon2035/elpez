<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 EL PEZ OFICIAL</title>
<style>
body{background:radial-gradient(circle at top,#1a1a4a 0%,#0a0a2a 60%,#07071e 100%);color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px;min-height:100vh}
.logo{width:110px;height:110px;border-radius:50%;border:3px solid #FFD700;object-fit:cover}
h1{color:#FFD700;margin:10px 0 5px;font-size:22px}
.box{max-width:520px;margin:15px auto;text-align:left}
label{color:#FFD700;font-weight:bold;display:block;margin:14px 0 6px;font-size:14px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:none;background:rgba(255,255,255,0.08);color:#fff;outline:none}
textarea{height:90px;resize:vertical}
.filebox{background:rgba(255,255,255,0.08);padding:12px;border-radius:12px}
.btn{width:100%;background:linear-gradient(#ffe88a,#FFD700);color:#000;font-weight:bold;padding:14px;border:none;border-radius:12px;cursor:pointer;margin-top:18px;font-size:16px}
.lista{max-width:520px;margin:20px auto;background:rgba(80,80,150,0.25);border-radius:15px;padding:15px;text-align:left}
.tema{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,0.06);padding:10px;border-radius:12px;margin-bottom:10px}
.tema img{width:60px;height:60px;border-radius:10px;object-fit:cover}
.tema b{color:#FFD700;font-size:14px}
audio{width:100%;height:32px;margin-top:4px}
.wabtn{background:#25D366;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;margin-top:6px}
.delbtn{background:#ff3b3b;color:#fff;border:none;padding:4px 8px;border-radius:10px;font-size:11px;margin-left:5px;display:none}
.admin-on .delbtn{display:inline-block}
</style>
</head>
<body id="body">

<img src="logo.png" class="logo" id="logo-img" onerror="this.src='https://via.placeholder.com/110/FFD700/000?text=PEZ'">
<h1 id="logo">EL DON 2035 EL PEZ OFICIAL 🐟</h1>
<p>Tus Temas (<span id="contador">0</span>)</p>

<div class="box">
<label>Dedicado a</label>
<input type="text" id="dedicado" placeholder="Ej: Mi hija">

<label>Genero</label>
<select id="genero">
<option>Balada Romántica</option>
<option>Reggaeton</option>
<option>Salsa</option>
<option>Bachata</option>
<option>Cumbia</option>
<option>Vallenato</option>
<option>Otro</option>
</select>

<label>Letra</label>
<textarea id="letra" placeholder="Pega aquí la letra..."></textarea>

<label>Archivo MP3</label>
<div class="filebox"><input type="file" id="mp3" accept="audio/*"></div>

<label>Portada</label>
<div class="filebox"><input type="file" id="portada" accept="image/*"></div>

<button class="btn" id="btnSubir">SUBIR DE VERDAD</button>
<p id="msg" style="text-align:center;color:#00ff88"></p>
</div>

<div class="lista">
<div style="color:#FFD700;font-weight:bold;margin-bottom:10px">🎧 Tus Temas (<span id="contador2">0</span>)</div>
<div id="lista"></div>
</div>

<script>
let temas = JSON.parse(localStorage.getItem("temas_pez_full") || "[]");
function render(){
 let lista=document.getElementById("lista");
 lista.innerHTML="";
 temas.forEach((t,i)=>{
  let div=document.createElement("div");
  div.className="tema";
  let cover=t.cover||"logo.png";
  div.innerHTML=`<img src="${cover}" onerror="this.src='logo.png'"><div style="flex:1"><b>${t.titulo||'Sin titulo'}</b><div style="font-size:11px;opacity:0.7">${t.dedicado?'Dedicado a: '+t.dedicado:''} ${t.genero?' - '+t.genero:''}</div><audio controls src="${t.audio}" class="aud"></audio><br><button class="wabtn" data-i="${i}">WhatsApp</button><button class="delbtn" data-i="${i}">Borrar</button></div>`;
  lista.appendChild(div);
 });
 document.getElementById("contador").textContent=temas.length;
 document.getElementById("contador2").textContent=temas.length;
 let audios=document.querySelectorAll(".aud");
 audios.forEach((a,idx)=>{
  a.addEventListener("ended",()=>{
   let sig=audios[idx+1];
   if(sig){sig.play();}
  });
  a.addEventListener("play",()=>{
   audios.forEach(o=>{if(o!==a)o.pause();});
  });
 });
}
function subir(){
 let dedicado=document.getElementById("dedicado").value;
 let genero=document.getElementById("genero").value;
 let letra=document.getElementById("letra").value;
 let titulo=letra.split("\n")[0].substring(0,30)||dedicado||genero||"Mi Tema";
 let fMp3=document.getElementById("mp3").files[0];
 let fCover=document.getElementById("portada").files[0];
 if(!fMp3){alert("Selecciona MP3 mi pez");return;}
 let rMp3=new FileReader();
 rMp3.onload=(eMp3)=>{
  if(fCover){
   let rC=new FileReader();
   rC.onload=(eC)=>{
    temas.push({titulo:titulo,dedicado:dedicado,genero:genero,letra:letra,audio:eMp3.target.result,cover:eC.target.result});
    localStorage.setItem("temas_pez_full",JSON.stringify(temas));
    document.getElementById("msg").textContent="¡Subido mi pez! ✅";
    limpiar();render();
   };
   rC.readAsDataURL(fCover);
  }else{
   temas.push({titulo:titulo,dedicado:dedicado,genero:genero,letra:letra,audio:eMp3.target.result,cover:""});
   localStorage.setItem("temas_pez_full",JSON.stringify(temas));
   document.getElementById("msg").textContent="¡Subido mi pez! ✅";
   limpiar();render();
  }
 };
 rMp3.readAsDataURL(fMp3);
}
function limpiar(){document.getElementById("dedicado").value="";document.getElementById("letra").value="";document.getElementById("mp3").value="";document.getElementById("portada").value="";}
document.getElementById("btnSubir").addEventListener("click",subir);
document.addEventListener("click",(e)=>{
 if(e.target.classList.contains("wabtn")){
  let i=e.target.getAttribute("data-i");
  window.open("https://wa.me/?text=Escucha "+encodeURIComponent(temas[i].titulo)+" https://eldon2035.github.io/elpez/");
 }
 if(e.target.classList.contains("delbtn")){
  if(!document.body.classList.contains("admin-on")){let c=prompt("Clave admin:");if(c!=="Elpez2035")return;document.body.classList.add("admin-on");}
  let i=parseInt(e.target.getAttribute("data-i"));temas.splice(i,1);localStorage.setItem("temas_pez_full",JSON.stringify(temas));render();
 }
});
let toques=0;
function adminCheck(){toques++;if(toques>=5){let p=prompt("Clave admin:");if(p==="Elpez2035"){document.body.classList.add("admin-on");alert("Admin ON");}toques=0;}setTimeout(()=>toques=0,3000);}
document.getElementById("logo").addEventListener("click",adminCheck);
document.getElementById("logo-img").addEventListener("click",adminCheck);
render();
</script>
</body>
</html>
