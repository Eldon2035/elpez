function compartir(id,titulo){let texto=encodeURIComponent("🎧 "+titulo+" - EL DON 2035 EL PEZ OFICIAL: "+LINK_OFICIAL);window.open("https://wa.me/?text="+texto,"_blank")}
function formatTime(s){if(isNaN(s))return"0:00";let m=Math.floor(s/60);let sec=Math.floor(s%60);return m+":"+(sec<10?"0":"")+sec}
function tocar(idx,isOnline=false){let lista=isOnline?temasOnlineCache:temasCache;let t=lista[idx];if(!t)return;if(!isOnline)currentIdx=idx;let urlA=t.audio_url||t.cancion_url||(t.audioBlob?URL.createObjectURL(t.audioBlob):"");let urlC=t.cover_url||t.portada_url||(t.coverBlob?URL.createObjectURL(t.coverBlob):'logo.png');document.getElementById("mainCover").src=urlC;document.getElementById("bgBlur").style.backgroundImage="url('"+urlC+"')";document.getElementById("mainTitle").textContent=t.titulo||"Sin titulo";document.getElementById("mainDedicado").textContent=(t.dedicado||t.artista||"Mi Negra Bella")+" • "+(t.genero||"Balada Romántica");document.getElementById("pImg").src=urlC;document.getElementById("pTitle").textContent=t.titulo;document.getElementById("pDed").textContent=t.dedicado||t.artista||"EL DON 2035";document.getElementById("favBtn").innerHTML=t.fav?"❤️ FAV":"🤍 FAV";let a=document.getElementById("mainAudio");a.src=urlA;a.volume=volumen;a.play();document.getElementById("playIcon").className="fa-solid fa-pause";document.getElementById("pfPlayIcon").className="fa-solid fa-pause";document.getElementById("playBtn").classList.add("playing");document.getElementById("nowPlaying").textContent="▶️ Sonando: "+t.titulo;document.getElementById("visualizer").classList.remove("paused");if(!isOnline){let tx=db.transaction("temas","readwrite");let req=tx.objectStore("temas").get(t.id);req.onsuccess=()=>{let tt=req.result;if(!tt)return;tt.repro=(tt.repro||0)+1;tx.objectStore("temas").put(tt)};}render(false);}
async function cargarOnline(){const{data,error}=await supabaseClient.from('canciones').select('*').order('created_at',{ascending:false});if(error){return[];}return data.map(d=>({id:d.id,titulo:d.titulo,dedicado:d.artista||d.dedicado,genero:d.genero||'Online',letra:d.letra,portada_url:d.portada_url,cover_url:d.portada_url,cancion_url:d.cancion_url,audio_url:d.cancion_url,online:true}))}
function limpiarNombre(n){return n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'_').replace(/__+/g,'_').slice(0,70);}
function mostrarMenu(e,id){e.preventDefault();selectedTemaId=id;const menu=document.getElementById('contextMenu');menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';menu.style.display='block';}
function ocultarMenu(){document.getElementById('contextMenu').style.display='none';}
async function reintentarSubida(soloPortada=false){if(!selectedTemaId)return;ocultarMenu();let t=await obtenerTemaPorId(selectedTemaId);if(!t)return;let msg=document.getElementById('msg');msg.textContent="♻️ Reintentando '"+t.titulo+"'...";try{let portada_url="",cancion_url="";if(t.coverBlob){let nombreP=Date.now()+"_retry_portada_"+limpiarNombre(t.titulo+"_portada.jpg");let{error}=await supabaseClient.storage.from('portadas').upload(nombreP,t.coverBlob);if(!error){let{data}=supabaseClient.storage.from('portadas').getPublicUrl(nombreP);portada_url=data.publicUrl;}}if(!soloPortada&&t.audioBlob){let nombreC=Date.now()+"_retry_"+limpiarNombre(t.titulo+".mp3");let{error}=await supabaseClient.storage.from('canciones').upload(nombreC,t.audioBlob);if(error)throw error;let{data}=supabaseClient.storage.from('canciones').getPublicUrl(nombreC);cancion_url=data.publicUrl;}if(soloPortada){let{data:existe}=await supabaseClient.from('canciones').select('*').eq('titulo',t.titulo).limit(1);if(existe&&existe.length>0&&portada_url){await supabaseClient.from('canciones').update({portada_url:portada_url}).eq('id',existe[0].id);}else if(portada_url){await supabaseClient.from('canciones').insert([{artista:t.dedicado||'El Don 2035',titulo:t.titulo,letra:t.letra,portada_url,cancion_url:""}]);}}else{await supabaseClient.from('canciones').insert([{artista:t.dedicado||'El Don 2035',titulo:t.titulo,letra:t.letra,portada_url,cancion_url}]);}msg.textContent="¡Reintentado ONLINE! ✅ "+t.titulo;render();}catch(err){msg.textContent="Error al reintentar: "+err.message;}}
async function render(){let temas=await obtenerTemas();temas.sort((a,b)=>(a.orden||0)-(b.orden||0));let online=await cargarOnline();temasOnlineCache=online;let filtrar=t=>!filtro||(t.titulo+(t.dedicado||"")).toLowerCase().includes(filtro.toLowerCase());temas=temas.filter(filtrar);online=online.filter(filtrar);temasCache=temas;
let l=document.getElementById("lista");l.innerHTML="";if(temas.length===0)l.innerHTML='<div style="opacity:.5;text-align:center;padding:12px;font-size:12px">No hay temas locales</div>';
temas.forEach((t,idx)=>{let urlC=t.coverBlob?URL.createObjectURL(t.coverBlob):'logo.png';let btnBorrar=modoBorrado?`<button class="btn-icon" onclick="borrarTema(${t.id})" style="color:#FF4444">🗑️</button>`:"";let d=document.createElement("div");d.className="tema";if(idx===currentIdx)d.classList.add("playing");d.dataset.id=t.id;d.draggable=true;d.oncontextmenu=(e)=>mostrarMenu(e,t.id);d.innerHTML=`<img src="${urlC}"><div class="tema-info" onclick="tocar(${idx})"><b>${t.fav?"❤️ ":""}${t.titulo}</b><span>${t.dedicado||''} • ${t.genero||''}</span></div><div class="tema-actions"><button class="btn-icon" onclick="verLetra(${t.id})"><i class="fa-solid fa-file-lines"></i></button><button class="btn-icon" onclick="compartir(${t.id},'${t.titulo}')"><i class="fa-solid fa-share"></i></button>${btnBorrar}</div>`;l.appendChild(d);});
let lOtros=document.getElementById("listaOtros");lOtros.innerHTML="";document.getElementById("otrosCount").textContent=online.length;if(online.length===0)lOtros.innerHTML='<div style="opacity:.5;text-align:center;padding:12px;font-size:12px">No hay temas de otros</div>';
online.forEach((t,idx)=>{let urlC=t.portada_url||'logo.png';let btnBorrar=modoBorrado?`<button class="btn-icon" onclick="borrarTemaOnline('${t.id}')" style="color:#FF4444">🗑️</button>`:"";let d=document.createElement("div");d.className="tema";d.innerHTML=`<img src="${urlC}"><div class="tema-info" onclick="tocar(${idx},true)"><b>🌐 ${t.titulo}</b><span>${t.dedicado||''} • ONLINE</span></div><div class="tema-actions"><button class="btn-icon" onclick="verLetra('${t.id}')"><i class="fa-solid fa-file-lines"></i></button><button class="btn-icon" onclick="descargar('${t.id}')"><i class="fa-solid fa-download"></i></button>${btnBorrar}</div>`;lOtros.appendChild(d);});
document.getElementById("contador").textContent=(await obtenerTemas()).length+online.length;document.getElementById("contador2").textContent=temas.length;}
function activarClave(){let a=Date.now();if(a-tiempoClick>3000)clicksLogo=0;tiempoClick=a;clicksLogo++;if(clicksLogo>=5){clicksLogo=0;let c=prompt("Clave secreta:");if(c===CLAVE){modoBorrado=true;alert("Borrado 60s ON");render();setTimeout(()=>{modoBorrado=false;render()},60000)}else if(c!==null)alert("Clave mala mi pez")}}
async function subir(){let ded=document.getElementById("dedicado").value.trim();let gen=document.getElementById("genero").value;let letra=document.getElementById("letra").value.trim();let f=document.getElementById("mp3").files[0];let c=document.getElementById("portada").files[0];if(!f){alert("Falta MP3 mi pez");return}let titulo=letra.split("\n")[0].substring(0,40).trim()||ded||f.name.replace(".mp3","")||"Mi Tema";let msg=document.getElementById("msg");msg.textContent="Subiendo online mi pez... espera";try{await guardarTema({titulo,dedicado:ded,genero:gen,letra,audioBlob:f,coverBlob:c||null,repro:0,orden:Date.now(),fav:false});let portada_url="",cancion_url="";if(c){let nombre=Date.now()+"_"+limpiarNombre(c.name);let{error}=await supabaseClient.storage.from('portadas').upload(nombre,c);if(error)throw error;let{data}=supabaseClient.storage.from('portadas').getPublicUrl(nombre);portada_url=data.publicUrl;}if(f){let nombre=Date.now()+"_"+limpiarNombre(f.name);let{error}=await supabaseClient.storage.from('canciones').upload(nombre,f);if(error)throw error;let{data}=supabaseClient.storage.from('canciones').getPublicUrl(nombre);cancion_url=data.publicUrl;}let{error:err2}=await supabaseClient.from('canciones').insert([{artista:ded||'El Don 2035',titulo,letra,portada_url,cancion_url}]);if(err2)throw err2;msg.textContent="¡Subido ONLINE para todos! ✅";document.getElementById("dedicado").value="";document.getElementById("letra").value="";render();}catch(e){console.error(e);msg.textContent="Error online: "+e.message+" (guardado local - click derecho para reintentar)";render();}}
abrirDB().then(()=>{document.getElementById('ctxRetry').addEventListener('click',()=>reintentarSubida(false));document.getElementById('ctxRetryPortada').addEventListener('click',()=>reintentarSubida(true));document.getElementById('ctxVerLetra').addEventListener('click',()=>{ocultarMenu();verLetra(selectedTemaId);});document.getElementById('ctxCompartir').addEventListener('click',()=>{ocultarMenu();let t=temasCache.find(x=>x.id==selectedTemaId);if(t)compartir(t.id,t.titulo);});document.addEventListener('click',ocultarMenu);
actualizarFechas();setInterval(actualizarFechas,1000);render();
let mainA=document.getElementById("mainAudio");
function updateProgress(){let pct=(mainA.currentTime/mainA.duration)*100;if(!isNaN(pct)){document.getElementById("progressFill").style.width=pct+"%";document.getElementById("playerTopProgressFill").style.width=pct+"%";}let cur=formatTime(mainA.currentTime);let dur=formatTime(mainA.duration);document.getElementById("curTime").textContent=cur;document.getElementById("durTime").textContent=dur;document.getElementById("pfCurTime").textContent=cur;document.getElementById("pfDurTime").textContent=dur;}
mainA.addEventListener("timeupdate",updateProgress);
mainA.addEventListener("play",()=>{document.getElementById("visualizer").classList.remove("paused");document.getElementById("playIcon").className="fa-solid fa-pause";document.getElementById("pfPlayIcon").className="fa-solid fa-pause";document.getElementById("playBtn").classList.add("playing");});
mainA.addEventListener("pause",()=>{document.getElementById("visualizer").classList.add("paused");document.getElementById("playIcon").className="fa-solid fa-play";document.getElementById("pfPlayIcon").className="fa-solid fa-play";document.getElementById("playBtn").classList.remove("playing");});
mainA.addEventListener("ended",()=>{if(repeatMode==="one"){mainA.currentTime=0;mainA.play();return}let next=null;if(shuffle){next=Math.floor(Math.random()*temasCache.length)}else{next=currentIdx+1}if(next<temasCache.length){tocar(next)}else if(repeatMode==="all"&&temasCache.length>0){tocar(0)}});
function seek(e){let rect=e.currentTarget.getBoundingClientRect();let pct=(e.clientX-rect.left)/rect.width;mainA.currentTime=pct*mainA.duration;}
document.getElementById("progressBar").addEventListener("click",seek);
document.getElementById("playerTopProgress").addEventListener("click",seek);
document.getElementById("logoBtn").addEventListener("click",activarClave);
document.getElementById("btnSubir").addEventListener("click",subir);
document.getElementById("buscador").addEventListener("input",e=>{filtro=e.target.value;render()});
function togglePlay(){if(mainA.paused){mainA.play();}else{mainA.pause();}}
document.getElementById("playBtn").addEventListener("click",togglePlay);
document.getElementById("pfPlayBtn").addEventListener("click",togglePlay);
function nextTrack(){let n=currentIdx+1;if(n>=temasCache.length)n=0;tocar(n);}
function prevTrack(){let p=currentIdx-1;if(p<0)p=temasCache.length-1;tocar(p);}
document.getElementById("nextBtn").addEventListener("click",nextTrack);
document.getElementById("pfNextBtn").addEventListener("click",nextTrack);
document.getElementById("prevBtn").addEventListener("click",prevTrack);
document.getElementById("pfPrevBtn").addEventListener("click",prevTrack);
function toggleShuffle(){shuffle=!shuffle;document.getElementById("shuffleBtn").classList.toggle("active",shuffle);document.getElementById("pfShuffleBtn").classList.toggle("active",shuffle);}
document.getElementById("shuffleBtn").addEventListener("click",toggleShuffle);
document.getElementById("pfShuffleBtn").addEventListener("click",toggleShuffle);
function toggleMode(){repeatMode=repeatMode==="all"?"one":"all";document.getElementById("modeBtn").classList.toggle("active",repeatMode==="one");document.getElementById("pfModeBtn").classList.toggle("active",repeatMode==="one");}
document.getElementById("modeBtn").addEventListener("click",toggleMode);
document.getElementById("pfModeBtn").addEventListener("click",toggleMode);
document.getElementById("volBtn").addEventListener("click",function(){volumen=volumen>0.5?0.3:1;mainA.volume=volumen;this.innerHTML=volumen>0.5?'<i class="fa-solid fa-volume-high"></i> 100%':'<i class="fa-solid fa-volume-low"></i> 30%';});
document.getElementById("pfVolBtn").addEventListener("click",function(){volumen=volumen>0.5?0.3:1;mainA.volume=volumen;this.innerHTML=volumen>0.5?'<i class="fa-solid fa-volume-high"></i>':'<i class="fa-solid fa-volume-low"></i>';});
document.getElementById("favBtn").addEventListener("click",()=>{if(temasCache.length===0)return;let t=temasCache[currentIdx];let tx=db.transaction("temas","readwrite");let req=tx.objectStore("temas").get(t.id);req.onsuccess=()=>{let tt=req.result;tt.fav=!tt.fav;tx.objectStore("temas").put(tt);document.getElementById("favBtn").innerHTML=tt.fav?"❤️ FAV":"🤍 FAV";render(false)}});
document.getElementById("btnFiesta").addEventListener("click",()=>{document.querySelector(".cover-wrap").requestFullscreen?.()});
document.getElementById("btnExport").addEventListener("click",async()=>{let temas=await obtenerTemas();if(temas.length===0){alert("No hay temas");return}let out=[];for(let t of temas){let buf=await t.audioBlob.arrayBuffer();let b64=btoa(String.fromCharCode(...new Uint8Array(buf)));let coverB64=null;if(t.coverBlob){let b2=await t.coverBlob.arrayBuffer();coverB64=btoa(String.fromCharCode(...new Uint8Array(b2)))}out.push({titulo:t.titulo,dedicado:t.dedicado,genero:t.genero,letra:t.letra,repro:t.repro,fav:t.fav,audioB64:b64,coverB64})}let blob=new Blob([JSON.stringify(out)],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="respaldo-pez-"+Date.now()+".json";a.click()});
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",async e=>{let file=e.target.files[0];if(!file)return;let txt=await file.text();let arr=JSON.parse(txt);for(let o of arr){let audioBlob=new Blob([Uint8Array.from(atob(o.audioB64),c=>c.charCodeAt(0))],{type:"audio/mpeg"});let coverBlob=o.coverB64?new Blob([Uint8Array.from(atob(o.coverB64),c=>c.charCodeAt(0))],{type:"image/jpeg"}):null;await guardarTema({titulo:o.titulo,dedicado:o.dedicado,genero:o.genero,letra:o.letra,repro:o.repro||0,fav:o.fav||false,orden:Date.now(),audioBlob,coverBlob})}render();alert("Importado "+arr.length+" temas mi pez")});});
</script>
</body>
</html>
