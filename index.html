<style>

/* === CURSOR EL PEZ DORADO 2035 === */

<script>
const SUPABASE_URL = "https://hrvmidwtojjmhmbxxkpz.supabase.co";
const SUPABASE_KEY = "sb_publishable_PYd42RgJIYn2WP2CA-wz1Q_7cQ2EaRU";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const LINK_OFICIAL="https://eldon2035.github.io/elpez/";
localStorage.removeItem("temas_pez_full");localStorage.removeItem("temas_pez");
const CLAVE="Elpez2035";let modoBorrado=false,clicksLogo=0,tiempoClick=0,db,shuffle=false,repeatMode="all",volumen=1,filtro="",currentIdx=0,temasCache=[],temasOnlineCache=[];
function abrirDB(){return new Promise(r=>{let q=indexedDB.open("PezDB",1);q.onupgradeneeded=e=>{e.target.result.createObjectStore("temas",{keyPath:"id",autoIncrement:true})};q.onsuccess=e=>{db=e.target.result;r()}})}
function guardarTema(t){return new Promise(r=>{let tx=db.transaction("temas","readwrite");tx.objectStore("temas").add(t);tx.oncomplete=r})}
function obtenerTemas(){return new Promise(r=>{let tx=db.transaction("temas","readonly");let req=tx.objectStore("temas").getAll();req.onsuccess=()=>r(req.result)})}
function borrarTema(id){if(!modoBorrado)return;if(confirm("¿Borrar mi pez?")){let tx=db.transaction("temas","readwrite");tx.objectStore("temas").delete(id);tx.oncomplete=render}}
async function borrarTemaOnline(id){if(!modoBorrado)return;if(confirm("¿Borrar de internet también mi pez?")){const {error}=await supabaseClient.from('canciones').delete().eq('id',id);if(error)alert("Error: "+error.message); else render();}}
function verLetra(id){let t=[...temasCache,...temasOnlineCache].find(x=>String(x.id)===String(id));if(t){document.getElementById("letraContenido").textContent=t.letra||"Sin letra mi pez";document.getElementById("letraModal").style.display="block";return;} let tx=db.transaction("temas","readonly");let req=tx.objectStore("temas").get(Number(id)||id);req.onsuccess=()=>{if(req.result){document.getElementById("letraContenido").textContent=req.result.letra||"Sin letra mi pez";document.getElementById("letraModal").style.display="block";}}}
function descargar(id){let t=[...temasCache,...temasOnlineCache].find(x=>String(x.id)===String(id));if(!t)return;if(t.audio_url||t.cancion_url){window.open(t.audio_url||t.cancion_url,'_blank');return;}let url=URL.createObjectURL(t.audioBlob);let a=document.createElement("a");a.href=url;a.download=t.titulo+".mp3";a.click()}
function compartir(id,titulo){let texto=encodeURIComponent("🎧 "+titulo+" - EL DON 2035 EL PEZ OFICIAL: "+LINK_OFICIAL);window.open("https://wa.me/?text="+texto,"_blank")}
function formatTime(s){if(isNaN(s))return"0:00";let m=Math.floor(s/60);let sec=Math.floor(s%60);return m+":"+(sec<10?"0":"")+sec}
function tocar(idx,isOnline=false){let lista=isOnline?temasOnlineCache:temasCache;let t=lista[idx];if(!t)return;if(!isOnline)currentIdx=idx;let urlA=t.audio_url||t.cancion_url||(t.audioBlob?URL.createObjectURL(t.audioBlob):"");let urlC=t.cover_url||t.portada_url||(t.coverBlob?URL.createObjectURL(t.coverBlob):'logo.png');document.getElementById("mainCover").src=urlC;document.getElementById("bgBlur").style.backgroundImage="url('"+urlC+"')";document.getElementById("mainTitle").textContent=t.titulo||"Sin titulo";document.getElementById("mainDedicado").textContent=(t.dedicado||t.artista||"Mi Negra Bella")+" • "+(t.genero||"Balada Romántica");document.getElementById("pImg").src=urlC;document.getElementById("pTitle").textContent=t.titulo;document.getElementById("pDed").textContent=t.dedicado||t.artista||"EL DON 2035";document.getElementById("favBtn").textContent=t.fav?"❤️":"🤍";let a=document.getElementById("mainAudio");a.src=urlA;a.volume=volumen;a.play();document.getElementById("playBtn").textContent="⏸️ PAUSA";document.getElementById("nowPlaying").textContent="▶️ Sonando: "+t.titulo+" ♾️";if(!isOnline){let tx=db.transaction("temas","readwrite");let req=tx.objectStore("temas").get(t.id);req.onsuccess=()=>{let tt=req.result;if(!tt)return;tt.repro=(tt.repro||0)+1;tx.objectStore("temas").put(tt)};} render(false);}
async function cargarOnline(){const {data,error}=await supabaseClient.from('canciones').select('*').order('created_at',{ascending:false});if(error){console.log("Supabase error:",error);return[];}return data.map(d=>({id:d.id,titulo:d.titulo,dedicado:d.artista||d.dedicado,genero:d.genero||'Online',letra:d.letra,portada_url:d.portada_url,cover_url:d.portada_url,cancion_url:d.cancion_url,audio_url:d.cancion_url,online:true}))}
async function render(){let temas=await obtenerTemas();temas.sort((a,b)=>(a.orden||0)-(b.orden||0));let online=await cargarOnline();temasOnlineCache=online;let filtrar=t=>!filtro||(t.titulo+(t.dedicado||"")).toLowerCase().includes(filtro.toLowerCase());temas=temas.filter(filtrar);online=online.filter(filtrar);temasCache=temas;let l=document.getElementById("lista");l.innerHTML="";if(temas.length===0&&online.length===0)l.innerHTML='<div style="opacity:.6;text-align:center;padding:16px;font-size:14px;font-weight:600">No hay temas mi pez - Sube tu primera canción</div>';online.forEach((t,idx)=>{let urlC=t.portada_url||'logo.png';let btnBorrar=modoBorrado?`<button onclick="borrarTemaOnline('${t.id}')" style="background:#ff444422;border:1px solid #ff4444;color:#ff5555;border-radius:6px;padding:4px 6px">🗑️</button>`:"";let d=document.createElement("div");d.className="tema";d.style.borderColor="#00ff8822";d.innerHTML=`<img src="${urlC}" onclick="tocar(${idx},true)" style="cursor:none"><div style="flex:1;min-width:0" onclick="tocar(${idx},true)"><b style="color:#00ff88;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">🌐 ${t.titulo}</b><div style="font-size:12px;opacity:.7">${t.dedicado||''} • ONLINE</div></div><button class="btn2" onclick="verLetra('${t.id}')">📜</button><button class="btn2" onclick="descargar('${t.id}')">⬇️</button><button class="btn2" onclick="compartir('${t.id}','${t.titulo}')">📲</button>${btnBorrar}`;l.appendChild(d);});temas.forEach((t,idx)=>{let urlC=t.coverBlob?URL.createObjectURL(t.coverBlob):'logo.png';let btnBorrar=modoBorrado?`<button onclick="borrarTema(${t.id})" style="background:#ff444422;border:1px solid #ff4444;color:#ff5555;border-radius:6px;padding:4px 6px">🗑️</button>`:"";let d=document.createElement("div");d.className="tema";if(idx===currentIdx)d.classList.add("playing");d.dataset.id=t.id;d.draggable=true;d.innerHTML=`<img src="${urlC}" onclick="tocar(${idx})" style="cursor:none"><div style="flex:1;min-width:0" onclick="tocar(${idx})"><b style="color:#FFD700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${t.fav?"❤️ ":""}${t.titulo} <span style="font-size:10px;opacity:.6">▶️${t.repro||0}</span></b><div style="font-size:12px;opacity:.7">${t.dedicado||''} • ${t.genero||''} • LOCAL</div></div><button class="btn2" onclick="verLetra(${t.id})">📜</button><button class="btn2" onclick="descargar(${t.id})">⬇️</button><button class="btn2" onclick="compartir(${t.id},'${t.titulo}')">📲</button>${btnBorrar}`;l.appendChild(d);});document.getElementById("contador").textContent=(await obtenerTemas()).length+online.length;document.getElementById("contador2").textContent=temas.length+online.length;}
function activarClave(){let a=Date.now();if(a-tiempoClick>3000)clicksLogo=0;tiempoClick=a;clicksLogo++;if(clicksLogo>=5){clicksLogo=0;let c=prompt("Clave secreta:");if(c===CLAVE){modoBorrado=true;alert("Borrado 60s ON - Ahora aparece 🗑️");render();setTimeout(()=>{modoBorrado=false;render()},60000)}else if(c!==null)alert("Clave mala mi pez")}}
async function subir(){let ded=document.getElementById("dedicado").value.trim();let gen=document.getElementById("genero").value;let letra=document.getElementById("letra").value.trim();let f=document.getElementById("mp3").files[0];let c=document.getElementById("portada").files[0];if(!f){alert("Falta MP3 mi pez");return}let titulo=letra.split("\n")[0].substring(0,40).trim()||ded||f.name.replace(".mp3","")||"Mi Tema";let msg=document.getElementById("msg");msg.textContent="Subiendo online mi pez... espera";try{await guardarTema({titulo,dedicado:ded,genero:gen,letra,audioBlob:f,coverBlob:c||null,repro:0,orden:Date.now(),fav:false});let portada_url="",cancion_url="";if(c){let nombre=Date.now()+"_"+c.name.replace(/\s/g,"_");let {error}=await supabaseClient.storage.from('portadas').upload(nombre,c);if(error)throw error;let {data}=supabaseClient.storage.from('portadas').getPublicUrl(nombre);portada_url=data.publicUrl;}if(f){let nombre=Date.now()+"_"+f.name.replace(/\s/g,"_");let {error}=await supabaseClient.storage.from('canciones').upload(nombre,f);if(error)throw error;let {data}=supabaseClient.storage.from('canciones').getPublicUrl(nombre);cancion_url=data.publicUrl;}let {error:err2}=await supabaseClient.from('canciones').insert([{artista:ded||'El Don 2035',titulo,letra,portada_url,cancion_url}]);if(err2)throw err2;msg.textContent="¡Subido ONLINE para todos! ✅";document.getElementById("dedicado").value="";document.getElementById("letra").value="";render();}catch(e){console.error(e);msg.textContent="Error online: "+e.message+" (pero se guardó local)";render();}}
abrirDB().then(()=>{
const pezCursor = document.getElementById('pezCursor');
let mouseX=0, mouseY=0, cursorX=0, cursorY=0;
document.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; });
(function animarCursor(){
  cursorX += (mouseX - cursorX) * 0.22;
  cursorY += (mouseY - cursorY) * 0.22;
  pezCursor.style.left = cursorX + 'px';
  pezCursor.style.top = cursorY + 'px';
  requestAnimationFrame(animarCursor);
})();
document.addEventListener('mousedown', ()=> pezCursor.classList.add('playing'));
document.addEventListener('mouseup', ()=> pezCursor.classList.remove('playing'));
document.querySelectorAll('button, .tema, .cover-wrap, input, select, textarea').forEach(el=>{
  el.addEventListener('mouseenter', ()=> { pezCursor.textContent='🎵'; pezCursor.classList.add('nota'); });
  el.addEventListener('mouseleave', ()=> { pezCursor.textContent='🐟'; pezCursor.classList.remove('nota'); });
});
render();
let mainA=document.getElementById("mainAudio");
mainA.addEventListener("timeupdate",()=>{let pct=(mainA.currentTime/mainA.duration)*100;if(!isNaN(pct))document.getElementById("progressFill").style.width=pct+"%";document.getElementById("curTime").textContent=formatTime(mainA.currentTime);document.getElementById("durTime").textContent=formatTime(mainA.duration)});
mainA.addEventListener("ended",()=>{if(repeatMode==="one"){mainA.currentTime=0;mainA.play();return}let next=null;if(shuffle){next=Math.floor(Math.random()*temasCache.length)}else{next=currentIdx+1}if(next < temasCache.length){tocar(next)}else if(repeatMode==="all" && temasCache.length>0){tocar(0)}});
document.getElementById("progressBar").addEventListener("click",e=>{let rect=e.currentTarget.getBoundingClientRect();let pct=(e.clientX-rect.left)/rect.width;mainA.currentTime=pct*mainA.duration});
document.getElementById("logoBtn").addEventListener("click",activarClave);
document.getElementById("btnSubir").addEventListener("click",subir);
document.getElementById("buscador").addEventListener("input",e=>{filtro=e.target.value;render()});
document.getElementById("playBtn").addEventListener("click",()=>{if(mainA.paused){mainA.play();document.getElementById("playBtn").textContent="⏸️ PAUSA"}else{mainA.pause();document.getElementById("playBtn").textContent="▶️ PLAY"}});
document.getElementById("modeBtn").addEventListener("click",function(){repeatMode=repeatMode==="all"?"one":"all";this.textContent=repeatMode==="all"?"♾️ TODO":"🔂 UNA"});
document.getElementById("shuffleBtn").addEventListener("click",function(){shuffle=!shuffle;this.textContent=shuffle?"🔀 ON":"🔀 OFF"});
document.getElementById("volBtn").addEventListener("click",function(){volumen=volumen>0.5?0.3:1;mainA.volume=volumen;this.textContent=volumen>0.5?"🔊 100%":"🔉 30%"});
document.getElementById("nextBtn").addEventListener("click",()=>{let n=currentIdx+1;if(n>=temasCache.length)n=0;tocar(n)});
document.getElementById("prevBtn").addEventListener("click",()=>{let p=currentIdx-1;if(p<0)p=temasCache.length-1;tocar(p)});
document.getElementById("favBtn").addEventListener("click",()=>{if(temasCache.length===0)return;let t=temasCache[currentIdx];let tx=db.transaction("temas","readwrite");let req=tx.objectStore("temas").get(t.id);req.onsuccess=()=>{let tt=req.result;tt.fav=!tt.fav;tx.objectStore("temas").put(tt);document.getElementById("favBtn").textContent=tt.fav?"❤️":"🤍";render(false)}});
document.getElementById("btnFiesta").addEventListener("click",()=>{document.querySelector(".cover-wrap").requestFullscreen?.()});
document.getElementById("btnExport").addEventListener("click",async()=>{let temas=await obtenerTemas();if(temas.length===0){alert("No hay temas");return}let out=[];for(let t of temas){let buf=await t.audioBlob.arrayBuffer();let b64=btoa(String.fromCharCode(...new Uint8Array(buf)));let coverB64=null;if(t.coverBlob){let b2=await t.coverBlob.arrayBuffer();coverB64=btoa(String.fromCharCode(...new Uint8Array(b2)))}out.push({titulo:t.titulo,dedicado:t.dedicado,genero:t.genero,letra:t.letra,repro:t.repro,fav:t.fav,audioB64:b64,coverB64})}let blob=new Blob([JSON.stringify(out)],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="respaldo-pez-"+Date.now()+".json";a.click()});
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",async e=>{let file=e.target.files[0];if(!file)return;let txt=await file.text();let arr=JSON.parse(txt);for(let o of arr){let audioBlob=new Blob([Uint8Array.from(atob(o.audioB64),c=>c.charCodeAt(0))],{type:"audio/mpeg"});let coverBlob=o.coverB64?new Blob([Uint8Array.from(atob(o.coverB64),c=>c.charCodeAt(0))],{type:"image/jpeg"}):null;await guardarTema({titulo:o.titulo,dedicado:o.dedicado,genero:o.genero,letra:o.letra,repro:o.repro||0,fav:o.fav||false,orden:Date.now(),audioBlob,coverBlob})}render();alert("Importado "+arr.length+" temas mi pez")});
});
</script>
</body>
</html>
