<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 EL PEZ OFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;color:#fff;font-family:'Poppins',Arial;background:#050712 url('fondo.jpg') fixed;background-size:cover}
body::before{content:"";position:fixed;inset:0;background:rgba(3,5,20,0.78);z-index:-1}
/* HEADER ELEGANTE IZQUIERDA */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;background:rgba(10,12,30,0.85);
  border-bottom:1px solid rgba(255,215,0,0.25);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:10
}
.topbar img{width:58px;height:58px;border-radius:50%;border:2px solid #FFD700;box-shadow:0 0 15px rgba(255,215,0,0.5)}
.topbar h1{font-family:'Cinzel',serif;color:#FFD700;font-size:18px;margin:0;letter-spacing:2px;text-shadow:0 0 10px rgba(255,215,0,0.4)}
.topbar span{font-size:11px;opacity:0.7;display:block;font-family:'Poppins';letter-spacing:0.5px}
.card{max-width:560px;margin:22px auto;background:rgba(20,25,50,0.72);backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,0.2);border-radius:18px;padding:20px}
label{color:#FFD700;font-weight:700;font-size:12px;display:block;margin:14px 0 6px;text-align:left;letter-spacing:1px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.45);color:#fff;outline:none}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#FFD700,#ffb700);color:#000;font-weight:800;border:none;border-radius:12px;margin-top:18px;cursor:pointer}
.tema{display:flex;gap:12px;background:rgba(255,255,255,0.06);padding:12px;border-radius:14px;margin-bottom:12px}
.tema img{width:60px;height:60px;border-radius:10px;border:1px solid #FFD700}
</style>
</head>
<body>
<div class="topbar">
  <img src="logo.png" onerror="this.src='https://via.placeholder.com/60/FFD700/000?text=PEZ'">
  <div>
    <h1>EL DON 2035 EL PEZ OFICIAL</h1>
    <span>Edición Lujo • Tus Temas (<span id="contador">0</span>)</span>
  </div>
</div>

<div class="card">
<label>Dedicado a</label><input id="dedicado" placeholder="Ej: Mi hija">
<label>Genero</label><select id="genero"><option>Balada Romántica</option><option>Reggaeton</option><option>Salsa</option><option>Bachata</option><option>Cumbia</option></select>
<label>Letra</label><textarea id="letra" placeholder="Pega aquí la letra..."></textarea>
<label>Archivo MP3</label><input type="file" id="mp3" accept="audio/*">
<label>Portada</label><input type="file" id="portada" accept="image/*">
<button class="btn" id="btnSubir">SUBIR DE VERDAD</button>
<p id="msg" style="color:#00ff88;text-align:center"></p>
</div>

<div class="card"><b style="color:#FFD700">🎧 Tus Temas (<span id="contador2">0</span>)</b><div id="lista" style="margin-top:12px"></div></div>

<script>
let temas=JSON.parse(localStorage.getItem("temas_pez_full")||"[]");
function render(){
 let l=document.getElementById("lista");l.innerHTML="";
 temas.forEach((t,i)=>{
  let d=document.createElement("div");d.className="tema";
  d.innerHTML=`<img src="${t.cover||'logo.png'}"><div style="flex:1"><b style="color:#FFD700">${t.titulo}</b><br><audio controls src="${t.audio}" class="aud" style="width:100%;height:30px"></audio></div>`;l.appendChild(d);
 });
 document.getElementById("contador").textContent=temas.length;document.getElementById("contador2").textContent=temas.length;
 let audios=document.querySelectorAll(".aud");
 audios.forEach((a,idx)=>{a.addEventListener("ended",()=>{let s=audios[idx+1];if(s)s.play();});a.addEventListener("play",()=>{audios.forEach(o=>{if(o!==a)o.pause();});});});
}
function subir(){
 let dedicado=document.getElementById("dedicado").value,genero=document.getElementById("genero").value,letra=document.getElementById("letra").value;
 let titulo=letra.split("\n")[0].substring(0,30)||dedicado||"Mi Tema";
 let f=document.getElementById("mp3").files[0],c=document.getElementById("portada").files[0];
 if(!f){alert("Falta MP3");return;}
 let r=new FileReader();r.onload=(e)=>{
  if(c){let rc=new FileReader();rc.onload=(ec)=>{temas.push({titulo,dedicado,genero,letra,audio:e.target.result,cover:ec.target.result});localStorage.setItem("temas_pez_full",JSON.stringify(temas));render();};rc.readAsDataURL(c);}
  else{temas.push({titulo,dedicado,genero,letra,audio:e.target.result,cover:""});localStorage.setItem("temas_pez_full",JSON.stringify(temas));render();}
 };r.readAsDataURL(f);
}
document.getElementById("btnSubir").addEventListener("click",subir);
render();
</script>
</body>
</html>
