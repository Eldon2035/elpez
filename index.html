<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EL DON 2035 - EL PEZ</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000a1a;color:#fff;font-family:Arial}header{background:#000c20;padding:12px 20px;display:flex;align-items:center;gap:14px;border-bottom:2px solid #FFD700} .logo{width:60px;height:60px;border-radius:50%;border:2px solid #FFD700;overflow:hidden;background:#fff} .logo img{width:100%;height:100%;object-fit:cover} h1{font-family:Orbitron;color:#FFD700;font-size:18px} .wrap{max-width:850px;margin:20px auto;padding:0 14px 100px} .card{background:linear-gradient(180deg,#0a0a2e,#0d1040);border:1.5px solid #FFD700;border-radius:14px;padding:18px;margin-bottom:20px} .song{background:#15153a;border:1.5px solid #FFD700;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:10px} .song img{width:48px;height:48px;border-radius:8px;object-fit:cover} .input{width:100%;background:rgba(255,255,255,0.05);border:1.5px solid #FFD700;border-radius:10px;padding:12px;color:#fff;margin:6px 0} .btn{width:100%;background:linear-gradient(90deg,#FFD700,#ffaa00);border:none;padding:14px;border-radius:10px;font-family:Orbitron;font-weight:900;cursor:pointer;color:#000} .player{position:fixed;bottom:0;left:0;right:0;background:#000c20;border-top:2px solid #FFD700;padding:10px 15px;display:none} .player.show{display:flex}</style></head><body>
<header><div class="logo"><img src="logo.png"></div><div><h1>EL DON 2035</h1><div style="color:#00ffff;font-size:10px;letter-spacing:3px">EL PEZ OFICIAL</div></div></header>
<div class="wrap"><div class="card"><h2 style="color:#FFD700;font-family:Orbitron">🎵 Tus Temas Subidos (<span id="count">0</span>)</h2><div id="lista" style="text-align:center;color:#FFD700;padding:15px">Cargando...</div></div>
<div class="card"><h2 style="color:#ffff00;font-family:Orbitron">Sube nueva música mi pez</h2><input class="input" id="title" placeholder="Título ej. Mi Conchita"><textarea class="input" id="lyrics" placeholder="Letra..."></textarea><input class="input" type="file" id="mp3" accept=".mp3,audio/*"><input class="input" type="file" id="cover" accept="image/*"><button class="btn" onclick="subir()">🚀 SUBIR DE VERDAD</button><div id="msg" style="margin-top:10px;text-align:center"></div></div></div>
<div class="player" id="player"><img id="pCover" src="logo.png" style="width:45px;height:45px;border-radius:8px;border:2px solid #FFD700"><div style="flex:1"><div id="pTitle" style="color:#FFD700;font-family:Orbitron">Nada</div></div><button onclick="tog()" id="pb" style="width:44px;height:44px;border-radius:50%;background:#FFD700;border:none">▶️</button><audio id="audio"></audio></div>
<script>
const URL='https://wwxytvhulgzowxyexlr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3cXl0dmh1bGdpZ293eWlleGxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NTk4MTQsImV4cCI6MjEwODQzNTgxNH0.FvEi7CZ2BhhTJ3GnT_oNU89RZ-2SPWyMcAX97lT7P6g';
const supa=supabase.createClient(URL,KEY);
let songs=[];
async function cargar(){const {data,error}=await supa.from('songs').select('*').order('created_at',{ascending:false});if(error){document.getElementById('lista').innerHTML='Error: '+error.message+'<br>Corre: alter table public.songs disable row level security;';return} songs=data;document.getElementById('count').textContent=songs.length;const d=document.getElementById('lista');if(songs.length==0) d.innerHTML='Aún no hay temas mi pez!'; else d.innerHTML=songs.map((s,i)=>`<div class="song" onclick="playSong(${i})"><img src="${s.cover_url||'logo.png'}"><div><b style="color:#FFD700">${s.title}</b></div><div style="margin-left:auto;width:32px;height:32px;border-radius:50%;background:#FFD700;display:flex;align-items:center;justify-content:center">▶</div></div>`).join('')}
function playSong(i){const s=songs[i];const a=document.getElementById('audio');document.getElementById('pTitle').textContent=s.title;document.getElementById('pCover').src=s.cover_url||'logo.png';document.getElementById('player').classList.add('show');a.src=s.audio_url;a.play()}
function tog(){const a=document.getElementById('audio');if(a.paused) a.play(); else a.pause()}
async function subir(){const t=document.getElementById('title').value.trim();const mp3=document.getElementById('mp3').files[0];const cover=document.getElementById('cover').files[0];const m=document.getElementById('msg');if(!t||!mp3){m.textContent='❌ Pon título y MP3';return} m.textContent='⏳ Subiendo...';try{const n1=Date.now()+'_'+mp3.name.replace(/[^a-z0-9._-]/gi,'_');const {error:e1}=await supa.storage.from('audios').upload(n1,mp3);if(e1) throw e1;const {data:u1}=supa.storage.from('audios').getPublicUrl(n1);let cu=null;if(cover){const n2=Date.now()+'_c_'+cover.name.replace(/[^a-z0-9._-]/gi,'_');await supa.storage.from('portadas').upload(n2,cover);const {data:u2}=supa.storage.from('portadas').getPublicUrl(n2);cu=u2.publicUrl} const {error:e2}=await supa.from('songs').insert([{title:t,audio_url:u1.publicUrl,cover_url:cu}]);if(e2) throw e2; m.textContent='✅ ¡SUBIDO MI PEZ!';cargar()}catch(err){m.textContent='❌ '+err.message}}
cargar();
</script></body></html>
