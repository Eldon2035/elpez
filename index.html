<script>
let temas=JSON.parse(localStorage.getItem("temas_pez_full")||"[]");
function render(){
 let l=document.getElementById("lista"); l.innerHTML="";
 temas.forEach((t)=>{
  let d=document.createElement("div");d.className="tema";
  d.innerHTML=`<img src="${t.cover||'logo.png'}" style="width:60px;height:60px;border-radius:10px;object-fit:cover"><div style="flex:1"><b style="color:#FFD700">${t.titulo}</b><br><audio controls src="${t.audio}" class="aud" style="width:100%"></audio></div>`;l.appendChild(d);
 });
 let c1=document.getElementById("contador"); if(c1) c1.textContent=temas.length;
 let c2=document.getElementById("contador2"); if(c2) c2.textContent=temas.length;
}
function comprimirImagen(file, cb){
  let img=new Image(); let r=new FileReader();
  r.onload=(e)=>{img.src=e.target.result; img.onload=()=>{
    let c=document.createElement("canvas"); let max=400;
    let w=img.width, h=img.height;
    if(w>h){if(w>max){h*=max/w; w=max}} else {if(h>max){w*=max/h; h=max}}
    c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    cb(c.toDataURL("image/jpeg",0.6));
  }};
  r.readAsDataURL(file);
}
function subir(){
 let dedicado=document.getElementById("dedicado").value;
 let genero=document.getElementById("genero").value;
 let letra=document.getElementById("letra").value;
 let titulo=letra.split("\n")[0].substring(0,30)||dedicado||"Mi Tema";
 let f=document.getElementById("mp3").files[0];
 let c=document.getElementById("portada").files[0];
 if(!f){alert("Falta MP3 mi pez");return;}
 if(f.size>15000000){alert("MP3 muy pesado");return;}
 document.getElementById("msg").textContent="Subiendo... espera mi pez";
 let r=new FileReader();
 r.onload=(e)=>{
   let guardar=(coverData)=>{
    try{
     temas.push({titulo,dedicado,genero,letra,audio:e.target.result,cover:coverData||""});
     localStorage.setItem("temas_pez_full",JSON.stringify(temas));
     document.getElementById("msg").textContent="¡Subido mi pez! ✅";
     render();
    }catch(err){
     temas.pop();
     alert("Memoria llena mi pez, borra historial del navegador o sube sin portada");
     document.getElementById("msg").textContent="Error memoria llena";
    }
   };
   if(c){ comprimirImagen(c, guardar); } else { guardar(""); }
 };
 r.readAsDataURL(f);
}
document.getElementById("btnSubir").addEventListener("click", subir);
render();
</script>
