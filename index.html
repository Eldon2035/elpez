<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 - EL PEZ OFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
header{background:#000;border-bottom:2px solid #ffcc00;padding:12px 25px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
header img{width:55px;height:55px;border-radius:50%;border:2px solid #ffcc00;object-fit:cover}
.container{max-width:650px;margin:30px auto;padding:15px}
label{color:#ffcc00;font-size:13px;font-weight:bold;display:block;margin:14px 0 5px 2px}
input,select,textarea{width:100%;padding:11px 14px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:14px;outline:none}
textarea{min-height:90px;resize:vertical}
.file-row{background:#1a1a1a;border-radius:8px;padding:6px 10px}
.btn{width:100%;margin-top:22px;padding:13px;background:#ffcc00;color:#000;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
.btn:hover{background:#ffd633}
#mensaje{text-align:center;margin-top:12px;min-height:18px;font-weight:bold}
.success{color:#00ff88}.error{color:#ff4444}
::placeholder{color:#888}
</style>
</head>
<body>
<header>
<img src="logo.png" alt="logo" onerror="this.style.display='none'">
<div style="color:#d4a017;font-weight:bold;font-size:20px">EL DON 2035</div>
</header>
<div class="container">
<div style="text-align:center;color:#ffcc00;font-weight:bold;margin-bottom:20px;font-size:18px">🎵 SUBIR TU MUSICA REAL</div>
<label>Titulo</label>
<input id="titulo" placeholder="Mi Negra Bella">
<label>Artista</label>
<input id="artista" value="El Pez">
<label>Dedicado a</label>
<input id="dedicado" placeholder="Negra Bella, Conchita">
<label>Genero</label>
<select id="genero">
<option>Balada Romántica</option><option>Reggaeton</option><option>Salsa</option><option>Bachata</option><option>Bolero</option><option>Cumbia</option><option>Otro</option>
</select>
<label>Letra</label>
<textarea id="letra" placeholder="Pega aqui la letra que te hice..."></textarea>
<label>Archivo MP3</label>
<div class="file-row"><input id="mp3" type="file" accept=".mp3,audio/*"></div>
<label>Portada</label>
<div class="file-row"><input id="portada" type="file" accept="image/*"></div>
<button id="btnSubir" class="btn" onclick="subirMusica()">SUBIR DE VERDAD</button>
<div id="mensaje"></div>
<div style="margin-top:35px;text-align:center;color:#ffcc00;font-weight:bold">🎧 Tus Temas (<span id="contador">0</span>)</div>
<div id="lista" style="margin-top:10px;text-align:center;opacity:0.7">Cargando...</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = "https://tjsvoufyqiqtogklqeqyf.supabase.co";
const SUPA_KEY = "sb_publishable_SfXj31r9TeqJu--BroldTw_WAEPpl4s";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
async function cargarTemas(){
 try{
  const {data,error}=await supa.from('songs').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  document.getElementById('contador').innerText=data.length;
  if(!data||data.length==0){document.getElementById('lista').innerHTML="Aun no hay temas";return;}
  let h="";data.forEach(t=>{h+=`<div style='background:#111;padding:10px;border-radius:8px;margin-bottom:8px;text-align:left'><b style='color:#ffcc00'>${t.title||''}</b> - ${t.artist||''}</div>`});
  document.getElementById('lista').innerHTML=h;
 }catch(e){document.getElementById('lista').innerHTML="Error: "+e.message}
}
async function subirMusica(){
 const btn=document.getElementById('btnSubir');const msg=document.getElementById('mensaje');
 const titulo=document.getElementById('titulo').value.trim();
 const artista=document.getElementById('artista').value.trim();
 const dedicado=document.getElementById('dedicado').value.trim();
 const genero=document.getElementById('genero').value;
 const letra=document.getElementById('letra').value.trim();
 const mp3=document.getElementById('mp3').files[0];
 const portada=document.getElementById('portada').files[0];
 if(!titulo){msg.innerHTML="<span class='error'>Pon titulo mi pez</span>";return;}
 if(!mp3){msg.innerHTML="<span class='error'>Selecciona MP3</span>";return;}
 btn.disabled=true;btn.innerText="SUBIENDO...";msg.innerText="Subiendo...";
 try{
  let audioUrl="";let coverUrl="";
  const mp3Name=Date.now()+"_"+mp3.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const {error:mp3Err}=await supa.storage.from('tracks').upload(mp3Name,mp3);if(mp3Err) throw mp3Err;
  const {data:mp3Data}=supa.storage.from('tracks').getPublicUrl(mp3Name);audioUrl=mp3Data.publicUrl;
  if(portada){
   const coverName=Date.now()+"_cover_"+portada.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const {error:coverErr}=await supa.storage.from('covers').upload(coverName,portada);
   if(!coverErr){const {data:coverData}=supa.storage.from('covers').getPublicUrl(coverName);coverUrl=coverData.publicUrl;}
  }
  const {error:dbErr}=await supa.from('songs').insert([{title:titulo,artist:artista,dedicated_to:dedicado,genre:genero,lyrics:letra,audio_url:audioUrl,cover_url:coverUrl}]);
  if(dbErr) throw dbErr;
  msg.innerHTML="<span class='success'>✅ ¡Subido con exito mi pez!</span>";
  document.getElementById('titulo').value="";document.getElementById('dedicado').value="";document.getElementById('letra').value="";document.getElementById('mp3').value="";document.getElementById('portada').value="";
  cargarTemas();
 }catch(e){msg.innerHTML="<span class='error'>❌ "+e.message+"</span>";}
 finally{btn.disabled=false;btn.innerText="SUBIR DE VERDAD";}
}
cargarTemas();
</script>
</body>
</html>
