<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 - EL PEZ OFICIAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1020;color:#fff;font-family:Arial}
header{background:#070b18;border-bottom:1px solid #ffcc00;padding:10px 20px;display:flex;align-items:center;gap:10px}
header img{width:48px;height:48px;border-radius:50%;border:2px solid #ffcc00}
.container{max-width:650px;margin:auto;padding:20px}
h2.main{color:#ffcc00;text-align:center;margin:20px 0}
label{color:#ffcc00;font-weight:bold;font-size:13px;margin:15px 0 5px 5px;display:block}
input,select,textarea{width:100%;background:#1c1e3a;border:1px solid #2a2c50;color:#fff;border-radius:10px;padding:12px;outline:none}
textarea{min-height:80px}
.box{background:#1c1e3a;border-radius:10px;padding:6px}
.btn{width:100%;background:#ffeb3b;color:#000;border:none;border-radius:12px;padding:14px;font-weight:bold;margin-top:20px;cursor:pointer;font-size:16px}
.card{background:#151735;border:1px solid #2a2c50;border-radius:14px;padding:15px;margin-top:20px}
#status{text-align:center;margin-top:12px;font-weight:bold;min-height:20px}
.song{background:#1e2040;border-radius:12px;padding:12px;margin-top:10px;display:flex;gap:12px}
.wa{background:#25D366;color:#fff;padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:12px;display:inline-block;margin-top:6px}
.del{background:#ff3b3b;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-weight:bold;cursor:pointer;margin-left:5px}
</style>
</head>
<body>
<header>
<img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/138/138817.png'">
<div><b style="color:#c9a000">EL DON 2035</b><br><small style="letter-spacing:2px;color:#888">EL PEZ OFICIAL</small></div>
</header>
<div class="container">
<h2 class="main">SUBIR TU MUSICA REAL</h2>
<label>Título</label><input id="title" placeholder="Mi conchita">
<label>Artista</label><input id="artist" value="El Pez">
<label>Dedicado a</label><input id="dedicated" value="Mi hija">
<label>Genero</label><select id="genre"><option>Balada Romántica</option><option>Reggaeton</option><option>Salsa</option><option>Bachata</option></select>
<label>Letra</label><textarea id="lyrics" placeholder="Pega aqui la letra mi pez..."></textarea>
<label>Archivo MP3</label><div class="box"><input type="file" id="mp3" accept=".mp3,audio/*"></div>
<label>Portada</label><div class="box"><input type="file" id="cover" accept="image/*"></div>
<button class="btn" onclick="subir()">🚀 SUBIR DE VERDAD</button>
<div id="status"></div>
<div class="card">
<div style="display:flex;justify-content:space-between"><b style="color:#ffcc00">🎧 Tus Temas (<span id="count">0</span>)</b><input id="search" placeholder="Buscar..." oninput="cargar()" style="width:110px;padding:6px;border-radius:8px"></div>
<div id="lista" style="margin-top:12px">Cargando...</div>
</div>
</div>
<script>
// URL CORRECTA DE TU FOTO
const SUPA_URL = "https://tjsvoufyqiqtogklqeqyf.supabase.co";
const SUPA_KEY = "sb_publishable_SfXj31r9TeqJu--BroldTw_WAEPpl4s";
const client = supabase.createClient(SUPA_URL, SUPA_KEY);

async function subir(){
 const title=document.getElementById('title').value.trim();
 const mp3=document.getElementById('mp3').files[0];
 const st=document.getElementById('status');
 if(!title||!mp3){st.innerHTML="❌ Pon título y MP3";return;}
 st.innerHTML="⏳ Subiendo...";
 try{
  const fname=Date.now()+"_"+mp3.name.replace(/[^a-z0-9.]/gi,'_');
  let {error}=await client.storage.from('tracks').upload(fname, mp3);
  if(error) throw error;
  const audio_url=client.storage.from('tracks').getPublicUrl(fname).data.publicUrl;
  let cover_url="";
  const cover=document.getElementById('cover').files[0];
  if(cover){
   const cname=Date.now()+"_c_"+cover.name.replace(/[^a-z0-9.]/gi,'_');
   await client.storage.from('covers').upload(cname, cover);
   cover_url=client.storage.from('covers').getPublicUrl(cname).data.publicUrl;
  }
  let {error:dbErr}=await client.from('songs').insert([{title, artist:document.getElementById('artist').value, dedicated_to:document.getElementById('dedicated').value, genre:document.getElementById('genre').value, lyrics:document.getElementById('lyrics').value, audio_url, cover_url}]);
  if(dbErr) throw dbErr;
  st.innerHTML="✅ ¡Subido mi pez!";
  cargar();
 }catch(e){st.innerHTML="❌ "+e.message;}
}
async function cargar(){
 try{
  let {data,error}=await client.from('songs').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  document.getElementById('count').innerText=data.length;
  const lista=document.getElementById('lista');
  if(data.length===0){lista.innerHTML="Aún no hay temas";return;}
  const q=document.getElementById('search').value.toLowerCase();
  let h="";
  data.filter(s=>s.title.toLowerCase().includes(q)).forEach(s=>{
   const txt=encodeURIComponent(`🎵 Escucha "${s.title}" de EL DON 2035 🔥 ${s.audio_url}`);
   h+=`<div class="song"><img src="${s.cover_url||'logo.png'}" style="width:60px;height:60px;border-radius:8px"><div style="flex:1"><b style="color:#ffcc00">${s.title}</b><br><audio controls src="${s.audio_url}" style="width:100%;height:30px;margin-top:5px"></audio><br><a class="wa" target="_blank" href="https://wa.me/?text=${txt}">📲 Compartir por WhatsApp</a><button class="del" onclick="borrar('${s.id}')">Borrar</button></div></div>`;
  });
  lista.innerHTML=h;
 }catch(e){document.getElementById('lista').innerHTML="Error: "+e.message;}
}
async function borrar(id){if(!confirm("¿Borrar?"))return; await client.from('songs').delete().eq('id',id); cargar();}
cargar();
</script>
</body>
</html>
