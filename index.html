<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 - EL PEZ OFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1020;color:#fff;font-family:Arial}
header{background:#070b18;border-bottom:2px solid #ffcc00;padding:12px 20px;display:flex;gap:10px;align-items:center;cursor:pointer;user-select:none}
header img{width:50px;height:50px;border-radius:50%;border:2px solid #ffcc00}
.container{max-width:650px;margin:auto;padding:20px}
h2{color:#ffcc00;text-align:center;margin:20px 0}
label{color:#ffcc00;font-weight:bold;font-size:13px;margin:14px 0 5px 5px;display:block}
input,select,textarea{width:100%;background:#1c1e3a;border:1px solid #2a2c50;color:#fff;border-radius:10px;padding:12px}
.btn{width:100%;background:#ffeb3b;color:#000;border:none;border-radius:12px;padding:14px;font-weight:bold;margin-top:18px;font-size:16px;cursor:pointer}
.card{background:#151735;border:1px solid #2a2c50;border-radius:14px;padding:15px;margin-top:20px}
#status{text-align:center;margin-top:10px;font-weight:bold}
.song{background:#1e2040;border-radius:12px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center}
.wa{background:#25D366;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:12px;display:inline-block;margin-top:6px}
.del{background:#ff3b3b;color:#fff;padding:8px 12px;border-radius:8px;border:none;font-weight:bold;font-size:12px;margin-left:6px;cursor:pointer;display:none}
.admin-on .del{display:inline-block}
#adminBadge{display:none;background:#ffcc00;color:#000;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:8px}
.admin-on #adminBadge{display:inline-block}
</style>
</head>
<body>
<header id="logoHeader" title="Toca 5 veces para modo admin">
<img src="logo.png" onerror="this.src='https://i.ibb.co/3m5cZQv/logo.png'">
<div><b style="color:#d4a017">EL DON 2035</b> <span id="adminBadge">ADMIN</span><br><small style="letter-spacing:2px;color:#888">EL PEZ OFICIAL</small></div>
</header>
<div class="container">
<h2>SUBIR TU MUSICA REAL</h2>
<label>Título</label><input id="title" value="Mi conchita">
<label>Artista</label><input id="artist" value="El Pez">
<label>Dedicado a</label><input id="dedicated" value="Mi hija">
<label>Genero</label><select id="genre"><option>Balada Romántica</option><option>Reggaeton</option><option>Balada</option></select>
<label>Letra</label><textarea id="lyrics" rows="3" placeholder="Pega aqui la letra..."></textarea>
<label>Archivo MP3</label><input type="file" id="mp3" accept=".mp3,audio/*">
<label>Portada</label><input type="file" id="cover" accept="image/*">
<button class="btn" onclick="subir()">🚀 SUBIR DE VERDAD</button>
<div id="status"></div>
<div class="card">
<b style="color:#ffcc00">🎧 Tus Temas (<span id="count">0</span>)</b>
<div id="lista" style="margin-top:10px">Cargando...</div>
</div>
</div>
<script>
const URL = "https://tjsvoufyiqtogklqeqyf.supabase.co";
const KEY = "sb_publishable_SfXj31r9TeqJu--BroldTw_WAEPpl4s";
const HEAD = { "apikey": KEY, "Authorization": "Bearer "+KEY, "Content-Type": "application/json" };
const CLAVE_ADMIN = "Elpez2035";
let isAdmin = localStorage.getItem("elpez_admin")==="1";
let taps=0;
if(isAdmin) document.body.classList.add("admin-on");

document.getElementById("logoHeader").addEventListener("click",()=>{
  taps++;
  if(taps>=5){
    taps=0;
    let c = prompt("🔒 Clave de ADMIN EL PEZ:");
    if(c===CLAVE_ADMIN){
      localStorage.setItem("elpez_admin","1");
      isAdmin=true;
      document.body.classList.add("admin-on");
      alert("✅ Modo ADMIN activado mi pez");
      cargar();
    }else if(c!==null){
      alert("❌ Clave incorrecta");
    }
  }
  setTimeout(()=>taps=0,3000);
});

async function cargar(){
 try{
  let r = await fetch(URL+"/rest/v1/songs?select=*&order=created_at.desc", {headers: HEAD});
  if(!r.ok) throw new Error(await r.text());
  let data = await r.json();
  document.getElementById('count').innerText = data.length;
  let lista = document.getElementById('lista');
  if(data.length==0){lista.innerHTML="Aún no hay temas";return;}
  let h="";
  data.forEach(s=>{
   let txt = encodeURIComponent(`🎵 Escucha "${s.title}" de EL DON 2035 🔥 ${s.audio_url}`);
   h+=`<div class="song"><img src="${s.cover_url||'logo.png'}" style="width:60px;height:60px;border-radius:8px;object-fit:cover"><div style="flex:1"><b style="color:#ffcc00">${s.title}</b><br><audio controls src="${s.audio_url}" style="width:100%;height:30px;margin-top:4px"></audio><br><a class="wa" target="_blank" href="https://wa.me/?text=${txt}">📲 WhatsApp</a><button class="del" onclick="borrar('${s.id}')">Borrar</button></div></div>`;
  });
  lista.innerHTML=h;
 }catch(e){document.getElementById('lista').innerHTML="Error: "+e.message;}
}

async function subir(){
 const title=document.getElementById('title').value.trim();
 const file=document.getElementById('mp3').files[0];
 const st=document.getElementById('status');
 if(!title||!file){st.innerHTML="❌ Pon título y MP3";return;}
 st.innerHTML="⏳ Subiendo...";
 try{
  let name = Date.now()+"_"+file.name.replace(/[^a-z0-9.]/gi,'_');
  let r1 = await fetch(URL+"/storage/v1/object/tracks/"+name, {method:"POST", headers: {...HEAD, "Content-Type": file.type}, body: file});
  if(!r1.ok) throw new Error(await r1.text());
  let audio_url = URL+"/storage/v1/object/public/tracks/"+name;
  let cover_url="";
  let cover=document.getElementById('cover').files[0];
  if(cover){
   let cname = Date.now()+"_c_"+cover.name.replace(/[^a-z0-9.]/gi,'_');
   await fetch(URL+"/storage/v1/object/covers/"+cname, {method:"POST", headers: {...HEAD, "Content-Type": cover.type}, body: cover});
   cover_url = URL+"/storage/v1/object/public/covers/"+cname;
  }
  let r2 = await fetch(URL+"/rest/v1/songs", {method:"POST", headers: {...HEAD, "Prefer":"return=minimal"}, body: JSON.stringify({title, artist:document.getElementById('artist').value, dedicated_to:document.getElementById('dedicated').value, genre:document.getElementById('genre').value, lyrics:document.getElementById('lyrics').value, audio_url, cover_url})});
  if(!r2.ok) throw new Error(await r2.text());
  st.innerHTML="✅ ¡Subido mi pez!";
  cargar();
 }catch(e){st.innerHTML="❌ "+e.message;}
}

async function borrar(id){
  let c = prompt("🔒 Para borrar pon la clave de ADMIN:");
  if(c!==CLAVE_ADMIN){alert("❌ Clave incorrecta");return;}
  if(!confirm("¿Seguro borrar mi pez?")) return;
  try{
    let r = await fetch(URL+"/rest/v1/songs?id=eq."+id, {method:"DELETE", headers: HEAD});
    if(!r.ok) throw new Error(await r.text());
    alert("🗑️ Borrado");
    cargar();
  }catch(e){alert("Error: "+e.message);}
}
cargar();
</script>
</body>
</html>
