<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 EL PEZ OFICIAL</title>
</head>
<body style="background:#0a0a2a;color:#fff;font-family:Arial;text-align:center;padding:20px">
<h1 style="color:#FFD700" id="logo">EL DON 2035 EL PEZ OFICIAL</h1>
<p>Tus Temas (<span id="contador">0</span>)</p>

<div style="border:2px dashed #FFD700;padding:15px;border-radius:15px;max-width:500px;margin:20px auto;background:#1a1a3a">
<h3 style="color:#FFD700">SUBIR TU MUSICA REAL</h3>
<input id="titulo" placeholder="Titulo" style="width:90%;padding:10px;margin:5px"><br>
<input id="mp3" type="file" accept="audio/*" style="margin:5px"><br>
<input id="portada" type="file" accept="image/*" style="margin:5px"><br>
<button onclick="subir()" style="background:#FFD700;padding:12px 20px;border-radius:20px;font-weight:bold">SUBIR DE VERDAD</button>
</div>

<div id="lista"></div>

<script>
let temas = JSON.parse(localStorage.getItem("temas_pez") || "[]");
function pintar(){
 document.getElementById("lista").innerHTML="";
 temas.forEach((t,i)=>{
  document.getElementById("lista").innerHTML+= '<div style="background:#1e1e3e;padding:10px;margin:10px auto;max-width:500px;border-radius:10px"><img src="'+(t.cover||'https://via.placeholder.com/80')+'" style="width:80px;height:80px;border-radius:10px"><br><b>'+t.titulo+'</b><br><audio controls src="'+t.audio+'" style="width:100%"></audio><br><button onclick="borrar('+i+')">Borrar</button></div>';
 });
 document.getElementById("contador").innerText=temas.length;
}
function subir(){
 let tit=document.getElementById("titulo").value;
 let f=document.getElementById("mp3").files[0];
 let c=document.getElementById("portada").files[0];
 if(!tit||!f){alert("Falta titulo y mp3");return;}
 let r=new FileReader();
 r.onload=function(e){
  if(c){
   let rc=new FileReader();
   rc.onload=function(ec){
    temas.push({titulo:tit,audio:e.target.result,cover:ec.target.result});
    localStorage.setItem("temas_pez",JSON.stringify(temas));
    pintar();
   };
   rc.readAsDataURL(c);
  }else{
   temas.push({titulo:tit,audio:e.target.result,cover:""});
   localStorage.setItem("temas_pez",JSON.stringify(temas));
   pintar();
  }
 };
 r.readAsDataURL(f);
}
function borrar(i){temas.splice(i,1);localStorage.setItem("temas_pez",JSON.stringify(temas));pintar();}
pintar();
</script>
</body>
</html>
