<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 EL PEZ OFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:'Poppins',Arial;background:#020414 url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1400') fixed;background-size:cover}
body::before{content:"";position:fixed;inset:0;background:rgba(3,5,20,0.82);z-index:-1}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(8,10,30,0.92);border-bottom:1px solid rgba(255,215,0,0.3);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
.topbar img{width:58px;height:58px;border-radius:50%;border:2px solid #FFD700;box-shadow:0 0 15px rgba(255,215,0,0.6);cursor:pointer;user-select:none}
.topbar h1{font-family:'Cinzel',serif;color:#FFD700;font-size:16px;margin:0;letter-spacing:2px;line-height:1.1}
.topbar span{font-size:11px;opacity:0.7}
.card{max-width:560px;margin:20px auto;background:rgba(20,25,60,0.78);backdrop-filter:blur(14px);border:1px solid rgba(255,215,0,0.22);border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
label{color:#FFD700;font-weight:700;font-size:11px;display:block;margin:14px 0 6px;letter-spacing:0.5px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.45);color:#fff;outline:none;font-family:'Poppins';font-size:14px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#FFD700;box-shadow:0 0 0 2px rgba(255,215,0,0.2)}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#FFD700,#ffb700);color:#000;font-weight:900;border:none;border-radius:12px;margin-top:18px;cursor:pointer;letter-spacing:1px;font-size:14px}
.btn:active{transform:scale(0.98)}
.tema{display:flex;gap:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);padding:12px;border-radius:14px;margin-bottom:12px;align-items:center}
.tema img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0}
</style>
</head>
<body>
<div class="topbar">
<img id="logoBtn" src="logo.png" onerror="this.src='https://via.placeholder.com/60/FFD700/000?text=PEZ'" title="5 clicks para clave">
<div><h1>EL DON 2035 EL PEZ OFICIAL</h1><span>Edición Lujo • Tus Temas (<span id="contador">0</span>) • Toca 5 veces el logo para borrar</span></div>
</div>

<div class="card">
<label>Dedicado a</label><input id="dedicado" placeholder="Ej: Mi Conchita">
<label>Género</label>
<select id="genero"><option>Balada Romántica</option><option>Reggaeton</option><option>Salsa</option><option>Bachata</option><option>Merengue</option><option>Vallenato</option></select>
<label>Letra del tema</label><textarea id="letra" placeholder="Pega aquí la letra de Mi Conchita..."></textarea>
<label>Archivo MP3 (máx 50MB)</label><input type="file" id="mp3" accept="audio/*">
<label>Portada JPG (opcional)</label><input type="file" id="portada" accept="image/*">
<button class="btn" id="btnSubir">SUBIR DE VERDAD</button>
<p id="msg" style="color:#00ff88;text-align:center;min-height:22px;margin:12px 0 0;font-weight:600"></p>
</div>

<div class="card">
<b style="color:#FFD700">🎧 Tus Temas (<span id="contador2">0</span>)</b>
<div id="lista" style="margin-top:14px"></div>
</div>

<script>
// Limpia memorias viejas que llenaban
localStorage.removeItem("temas_pez_full");
localStorage.removeItem("temas_pez");

const CLAVE_BORRADO = "Elpez2035";
let modoBorrado = false;
let clicksLogo = 0;
let tiempoClick = 0;
let db;

function abrirDB(){return new Promise((res,rej)=>{let r=indexedDB.open("PezDB",1);r.onupgradeneeded=e=>{e.target.result.createObjectStore("temas",{keyPath:"id",autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=rej})}
function guardarTema(t){return new Promise((res,rej)=>{let tx=db.transaction("temas","readwrite");tx.objectStore("temas").add(t);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function obtenerTemas(){return new Promise((res)=>{let tx=db.transaction("temas","readonly");let req=tx.objectStore("temas").getAll();req.onsuccess=()=>res(req.result)})}

async function render(){
 let temas=await obtenerTemas();
 let l=document.getElementById("lista"); l.innerHTML="";
 if(temas.length===0){ l.innerHTML='<div style="opacity:0.5;text-align:center;padding:20px;font-size:13px">Aún no hay temas mi pez, sube Mi Conchita</div>'; }
 temas.forEach((t)=>{
  let urlAudio=URL.createObjectURL(t.audioBlob);
  let urlCover=t.coverBlob?URL.createObjectURL(t.coverBlob):'logo.png';
  let btnBorrar = modoBorrado ? `<button onclick="borrarTema(${t.id})" style="background:rgba(255,68,68,0.2);border:1px solid #ff4444;color:#ff5555;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:16px">🗑️</button>` : ``;
  let div=document.createElement("div");div.className="tema";
  div.innerHTML=`<img src="${urlCover}"><div style="flex:1;min-width:0"><b style="color:#FFD700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.titulo}</b><div style="font-size:11px;opacity:0.7">${t.dedicado||''} • ${t.genero||''}</div><audio controls src="${urlAudio}" class="aud" style="width:100%;height:32px;margin-top:6px"></audio></div>${btnBorrar}`;
  l.appendChild(div);
 });
 document.getElementById("contador").textContent=temas.length;
 document.getElementById("contador2").textContent=temas.length;

 // ANTI-ENCIMADO Y AUTOPLAY
 let audios=document.querySelectorAll(".aud");
 audios.forEach((audio)=>{
  audio.addEventListener("play",()=>{ audios.forEach(o=>{ if(o!==audio) o.pause(); }); });
  audio.addEventListener("ended",()=>{ let arr=Array.from(audios); let idx=arr.indexOf(audio); let sig=arr[idx+1]; if(sig) sig.play(); });
 });
}

async function borrarTema(id){
 if(!modoBorrado) return;
 if(confirm("¿Seguro borrar este tema mi pez?")){
  let tx=db.transaction("temas","readwrite");
  tx.objectStore("temas").delete(id);
  tx.oncomplete=render;
 }
}

function activarClave(){
 let ahora=Date.now();
 if(ahora-tiempoClick>3000) clicksLogo=0;
 tiempoClick=ahora;
 clicksLogo++;
 if(clicksLogo>=5){
  clicksLogo=0;
  let clave=prompt("🔐 Pon la clave secreta mi pez:");
  if(clave===CLAVE_BORRADO){
   modoBorrado=true;
   alert("✅ Modo borrado activado mi pez - Tienes 60 segundos");
   render();
   setTimeout(()=>{ modoBorrado=false; render(); }, 60000);
  } else if(clave!==null){
   alert("❌ Clave incorrecta mi pez");
  }
 }
}

async function subir(){
 let dedicado=document.getElementById("dedicado").value.trim();
 let genero=document.getElementById("genero").value;
 let letra=document.getElementById("letra").value.trim();
 let f=document.getElementById("mp3").files[0];
 let c=document.getElementById("portada").files[0];
 if(!f){ alert("Falta el MP3 mi pez"); return; }
 if(f.size>52428800){ alert("MP3 muy pesado, máx 50MB mi pez"); return; }
 let titulo=letra.split("\n")[0].substring(0,50).trim()||dedicado||f.name.replace(".mp3","")||"Mi Tema";
 document.getElementById("msg").textContent="Subiendo "+f.name+" ...";
 try{
  await guardarTema({titulo,dedicado,genero,letra,audioBlob:f,coverBlob:c||null,fecha:Date.now()});
  document.getElementById("msg").textContent="¡Subido mi pez! ✅ "+titulo;
  document.getElementById("dedicado").value="";document.getElementById("letra").value="";document.getElementById("mp3").value="";document.getElementById("portada").value="";
  render();
 }catch(e){ document.getElementById("msg").textContent="Error: "+e.message; }
}

abrirDB().then(()=>{
 render();
 document.getElementById("logoBtn").addEventListener("click", activarClave);
 document.getElementById("btnSubir").addEventListener("click", subir);
});
</script>
</body>
</html>
