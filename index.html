<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 EL PEZ OFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:'Poppins';background:#020414 url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1400') fixed;background-size:cover}
body::before{content:"";position:fixed;inset:0;background:rgba(3,5,20,0.84);z-index:-1}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(8,10,30,0.95);border-bottom:2px solid rgba(255,215,0,0.35);position:sticky;top:0;z-index:20}
.topbar img{width:58px;height:58px;border-radius:50%;border:2px solid #FFD700;box-shadow:0 0 15px rgba(255,215,0,0.6);cursor:pointer}
.topbar h1{font-family:'Cinzel';color:#FFD700;font-size:15px;margin:0;letter-spacing:2px}
.card{max-width:560px;margin:18px auto;background:rgba(20,25,60,0.8);backdrop-filter:blur(14px);border:1px solid rgba(255,215,0,0.25);border-radius:18px;padding:20px}
label{color:#FFD700;font-weight:700;font-size:11px;display:block;margin:14px 0 6px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.5);color:#fff;font-family:'Poppins'}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#FFD700,#ffb700);color:#000;font-weight:900;border:none;border-radius:12px;margin-top:18px;cursor:pointer}
.tema{display:flex;gap:12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.08);padding:12px;border-radius:14px;margin-bottom:12px;align-items:center}
.tema.playing{border-color:#FFD700;background:rgba(255,215,0,0.12);box-shadow:0 0 12px rgba(255,215,0,0.25)}
</style>
</head>
<body>
<div class="topbar"><img id="logoBtn" src="logo.png"><div><h1>EL DON 2035 EL PEZ OFICIAL</h1><span style="font-size:11px;opacity:.7">Tus Temas (<span id="contador">0</span>) • BUCLE ♾️ ACTIVO</span></div></div>
<div class="card">
<label>Dedicado a</label><input id="dedicado" placeholder="Mi Conchita">
<label>Género</label><select id="genero"><option>Balada Romántica</option><option>Reggaeton</option><option>Salsa</option><option>Bachata</option></select>
<label>Letra</label><textarea id="letra"></textarea>
<label>MP3</label><input type="file" id="mp3" accept="audio/*">
<label>Portada</label><input type="file" id="portada" accept="image/*">
<button class="btn" id="btnSubir">SUBIR DE VERDAD</button>
<p id="msg" style="color:#00ff88;text-align:center;min-height:22px;margin:10px 0 0;font-weight:600"></p>
<p id="nowPlaying" style="color:#FFD700;text-align:center;font-size:12px;min-height:16px;margin:8px 0 0"></p>
</div>
<div class="card"><b style="color:#FFD700">🎧 Tus Temas (<span id="contador2">0</span>) - ♾️ Bucle Infinito</b><div id="lista" style="margin-top:14px"></div></div>

<script>
localStorage.removeItem("temas_pez_full");localStorage.removeItem("temas_pez");
const CLAVE="Elpez2035";let modoBorrado=false,clicksLogo=0,tiempoClick=0,db;
function abrirDB(){return new Promise(r=>{let q=indexedDB.open("PezDB",1);q.onupgradeneeded=e=>{e.target.result.createObjectStore("temas",{keyPath:"id",autoIncrement:true})};q.onsuccess=e=>{db=e.target.result;r()}})}
function guardarTema(t){return new Promise(r=>{let tx=db.transaction("temas","readwrite");tx.objectStore("temas").add(t);tx.oncomplete=r})}
function obtenerTemas(){return new Promise(r=>{let tx=db.transaction("temas","readonly");let req=tx.objectStore("temas").getAll();req.onsuccess=()=>r(req.result)})}
async function render(){
 let temas=await obtenerTemas();
 let l=document.getElementById("lista");l.innerHTML="";
 if(temas.length===0) l.innerHTML='<div style="opacity:.5;text-align:center;padding:20px">No hay temas mi pez</div>';
 temas.forEach((t,index)=>{
  let urlA=URL.createObjectURL(t.audioBlob);let urlC=t.coverBlob?URL.createObjectURL(t.coverBlob):'logo.png';
  let btn=modoBorrado?`<button onclick="borrarTema(${t.id})" style="background:#ff444422;border:1px solid #ff4444;color:#ff5555;border-radius:8px;padding:6px 10px">🗑️</button>`:"";
  let d=document.createElement("div");d.className="tema";d.innerHTML=`<img src="${urlC}" style="width:58px;height:58px;border-radius:10px;object-fit:cover"><div style="flex:1"><b style="color:#FFD700">${t.titulo}</b><div style="font-size:11px;opacity:.7">${t.dedicado||''}</div><audio controls src="${urlA}" preload="metadata" data-index="${index}" data-titulo="${t.titulo}" style="width:100%;height:32px;margin-top:6px"></audio></div>${btn}`;
  l.appendChild(d);
 });
 document.getElementById("contador").textContent=temas.length;document.getElementById("contador2").textContent=temas.length;
 let audios=l.querySelectorAll("audio");
 audios.forEach(audio=>{
  audio.addEventListener("play",()=>{
   document.querySelectorAll("audio").forEach(a=>{if(a!==audio)a.pause()});
   document.querySelectorAll(".tema").forEach(el=>el.classList.remove("playing"));
   audio.closest(".tema").classList.add("playing");
   document.getElementById("nowPlaying").textContent="▶️ Sonando: "+audio.dataset.titulo+" ♾️";
  });
  audio.addEventListener("ended",()=>{
   let idx=parseInt(audio.dataset.index);
   audio.closest(".tema").classList.remove("playing");
   let todos=Array.from(document.querySelectorAll("#lista audio"));
   let siguiente=todos[idx+1];
   // BUCLE INFINITO MI PEZ
   if(siguiente){
    document.getElementById("nowPlaying").textContent="⏭️ Siguiente: "+siguiente.dataset.titulo;
    siguiente.currentTime=0;setTimeout(()=>siguiente.play().catch(()=>{}),400);
   }else{
    // SI ERA LA ULTIMA, VUELVE A LA PRIMERA
    if(todos.length>0){
     document.getElementById("nowPlaying").textContent="♾️ Bucle: Volviendo al inicio - "+todos[0].dataset.titulo;
     todos[0].currentTime=0;setTimeout(()=>todos[0].play().catch(()=>{}),600);
    }
   }
  });
 });
}
async function borrarTema(id){if(!modoBorrado)return;if(confirm("¿Borrar mi pez?")){let tx=db.transaction("temas","readwrite");tx.objectStore("temas").delete(id);tx.oncomplete=render}}
function activarClave(){let a=Date.now();if(a-tiempoClick>3000)clicksLogo=0;tiempoClick=a;clicksLogo++;if(clicksLogo>=5){clicksLogo=0;let c=prompt("Clave secreta:");if(c===CLAVE){modoBorrado=true;alert("Modo borrado 60s");render();setTimeout(()=>{modoBorrado=false;render()},60000)}else if(c!==null)alert("Clave mala")}}
async function subir(){let ded=document.getElementById("dedicado").value.trim();let gen=document.getElementById("genero").value;let letra=document.getElementById("letra").value.trim();let f=document.getElementById("mp3").files[0];let c=document.getElementById("portada").files[0];if(!f){alert("Falta MP3");return}let titulo=letra.split("\n")[0].substring(0,50).trim()||ded||f.name.replace(".mp3","")||"Mi Tema";document.getElementById("msg").textContent="Subiendo...";await guardarTema({titulo,dedicado:ded,genero:gen,letra,audioBlob:f,coverBlob:c||null});document.getElementById("msg").textContent="¡Subido!";render()}
abrirDB().then(()=>{render();document.getElementById("logoBtn").addEventListener("click",activarClave);document.getElementById("btnSubir").addEventListener("click",subir)});
</script>
</body>
</html>
