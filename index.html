<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 EL PEZ OFICIAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
*{font-family:'Poppins',Arial}
body{
  margin:0;min-height:100vh;color:#fff;
  background:#020510 url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200') no-repeat fixed;
  background-size:cover;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;
  background: 
   radial-gradient(circle at 30% 20%, rgba(255,215,0,0.25) 0%, transparent 50%),
   radial-gradient(circle at 80% 80%, rgba(0,100,255,0.15) 0%, transparent 40%),
   linear-gradient(rgba(0,0,0,0.7), rgba(5,10,30,0.9));
  z-index:-1;
}
.header{text-align:center;padding:35px 15px 10px}
.logo{
  width:130px;height:130px;border-radius:50%;border:4px solid #FFD700;
  box-shadow:0 0 25px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.2);
  object-fit:cover;animation:glow 3s infinite alternate
}
@keyframes glow{from{box-shadow:0 0 20px #FFD700}to{box-shadow:0 0 40px #FFD700,0 0 80px #ffae00}}
h1{color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.6);margin:15px 0 5px;letter-spacing:1px}
.card{
  max-width:560px;margin:20px auto;background:rgba(20,25,50,0.65);
  backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,0.2);
  border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,0.6)
}
label{color:#FFD700;font-weight:700;font-size:13px;display:block;margin:14px 0 6px;text-align:left}
input,select,textarea{
  width:100%;box-sizing:border-box;padding:12px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:#fff;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#FFD700}
.filebox{background:rgba(255,255,255,0.06);padding:10px;border-radius:12px;border:1px dashed rgba(255,215,0,0.3)}
.btn{
  width:100%;padding:15px;background:linear-gradient(90deg,#FFD700,#ffb700);
  color:#000;font-weight:800;border:none;border-radius:12px;cursor:pointer;
  margin-top:18px;font-size:16px;box-shadow:0 5px 20px rgba(255,215,0,0.4)
}
.btn:hover{transform:scale(1.02)}
.lista{max-width:560px;margin:25px auto}
.tema{
  display:flex;gap:12px;background:rgba(255,255,255,0.07);backdrop-filter:blur(8px);
  padding:12px;border-radius:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.08)
}
.tema img{width:65px;height:65px;border-radius:12px;object-fit:cover;border:2px solid #FFD700}
.tema b{color:#FFD700}
audio{width:100%;margin-top:6px;height:32px}
.wabtn{background:#25D366;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<img src="logo.png" class="logo" id="logo-img" onerror="this.src='https://via.placeholder.com/130/FFD700/000?text=PEZ'">
<h1>EL DON 2035 EL PEZ OFICIAL 🐟</h1>
<p style="opacity:0.8">Tus Temas (<span id="contador">0</span>) • Edición Lujo</p>
</div>

<div class="card">
<label>Dedicado a</label>
<input id="dedicado" placeholder="Ej: Mi hija">
<label>Genero</label>
<select id="genero"><option>Balada Romántica</option><option>Reggaeton</option><option>Salsa</option><option>Bachata</option><option>Cumbia</option><option>Vallenato</option><option>Otro</option></select>
<label>Letra</label>
<textarea id="letra" placeholder="Pega aquí la letra..."></textarea>
<label>Archivo MP3</label>
<div class="filebox"><input type="file" id="mp3" accept="audio/*"></div>
<label>Portada</label>
<div class="filebox"><input type="file" id="portada" accept="image/*"></div>
<button class="btn" id="btnSubir">✨ SUBIR DE VERDAD</button>
<p id="msg" style="text-align:center;color:#00ff88;margin-top:10px"></p>
</div>

<div class="lista card">
<div style="color:#FFD700;font-weight:700;margin-bottom:12px">🎧 Tus Temas (<span id="contador2">0</span>)</div>
<div id="lista"></div>
</div>

<script>
let temas=JSON.parse(localStorage.getItem("temas_pez_full")||"[]");
function render(){
 let l=document.getElementById("lista");l.innerHTML="";
 temas.forEach((t,i)=>{
  let d=document.createElement("div");d.className="tema";
  let cover=t.cover||"logo.png";
  d.innerHTML=`<img src="${cover}" onerror="this.src='logo.png'"><div style="flex:1"><b>${t.titulo}</b><div style="font-size:11px;opacity:0.6">${t.dedicado?'Dedicado a: '+t.dedicado:''} ${t.genero?' • '+t.genero:''}</div><audio controls src="${t.audio}" class="aud"></audio><br><button class="wabtn" data-i="${i}">WhatsApp</button></div>`;
  l.appendChild(d);
 });
 document.getElementById("contador").textContent=temas.length;
 document.getElementById("contador2").textContent=temas.length;
 let audios=document.querySelectorAll(".aud");
 audios.forEach((a,idx)=>{
  a.addEventListener("ended",()=>{let s=audios[idx+1];if(s)s.play();});
  a.addEventListener("play",()=>{audios.forEach(o=>{if(o!==a)o.pause();});});
 });
}
function subir(){
 let dedicado=document.getElementById("dedicado").value;
 let genero=document.getElementById("genero").value;
 let letra=document.getElementById("letra").value;
 let titulo=letra.split("\n")[0].substring(0,30)||dedicado||"Mi Tema";
 let fMp3=document.getElementById("mp3").files[0];
 let fCover=document.getElementById("portada").files[0];
 if(!fMp3){alert("Falta MP3 mi pez");return;}
 let r=new FileReader();
 r.onload=(e)=>{
  if(fCover){
   let rc=new FileReader();rc.onload=(ec)=>{
    temas.push({titulo,dedicado,genero,letra,audio:e.target.result,cover:ec.target.result});
    localStorage.setItem("temas_pez_full",JSON.stringify(temas));document.getElementById("msg").textContent="¡Subido mi pez! ✅";render();
   };rc.readAsDataURL(fCover);
  }else{
   temas.push({titulo,dedicado,genero,letra,audio:e.target.result,cover:""});
   localStorage.setItem("temas_pez_full",JSON.stringify(temas));document.getElementById("msg").textContent="¡Subido mi pez! ✅";render();
  }
 };r.readAsDataURL(fMp3);
}
document.getElementById("btnSubir").addEventListener("click",subir);
document.addEventListener("click",(e)=>{if(e.target.classList.contains("wabtn")){let i=e.target.getAttribute("data-i");window.open("https://wa.me/?text=Escucha "+encodeURIComponent(temas[i].titulo)+" https://eldon2035.github.io/elpez/");}});
render();
</script>
</body>
</html>
