<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL DON 2035 - EL PEZ OFICIAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:15px}
.card{background:#151515;border:1px solid #333;border-radius:15px;padding:15px;margin-top:15px}
label{color:#d4a017;font-weight:bold;display:block;margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}
button.main{width:100%;padding:15px;background:#ffcc00;border:none;border-radius:12px;color:#000;font-weight:bold;font-size:18px;margin-top:15px;cursor:pointer}
#status{text-align:center;margin-top:10px;font-weight:bold}
.song{background:#1a1a1a;border:1px solid #333;border-radius:15px;padding:12px;margin-top:12px;display:flex;gap:10px}
</style>
</head>
<body>
<div style="text-align:center;border:2px solid #d4a017;border-radius:15px;padding:15px;background:#111">
<h1 style="color:#ffb700">EL DON 2035 - EL PEZ OFICIAL</h1>
<p>SUBIR TU MUSICA REAL</p>
</div>
<div class="card">
<label>Título</label><input id="title" value="Mi conchita">
<label>Artista</label><input id="artist" value="El Pez">
<label>Dedicado a</label><input id="dedicated" value="Mi hija">
<label>Género</label><select id="genre"><option>Balada Romántica</option><option>Reggaeton</option></select>
<label>Letra</label><textarea id="lyrics" rows="3" placeholder="Pega aqui la letra mi pez..."></textarea>
<label>Archivo MP3</label><input type="file" id="mp3" accept=".mp3,audio/*">
<label>Portada</label><input type="file" id="cover" accept="image/*">
<button class="main" onclick="subir()">🚀 SUBIR DE VERDAD</button>
<div id="status"></div>
</div>
<div class="card">🎧 Tus Temas (<span id="count">0</span>)<div id="lista" style="margin-top:10px"></div></div>
<script>
const URL = "https://tjsvoufyqiqtogklqeqyf.supabase.co";
const KEY = "sb_publishable_SfXj31r9TeqJu--BroldTw_WAEPpl4s";
const supabaseClient = supabase.createClient(URL, KEY);

async function subir(){
 const title=document.getElementById('title').value.trim();
 const mp3=document.getElementById('mp3').files[0];
 const status=document.getElementById('status');
 if(!mp3){status.innerHTML="❌ Selecciona MP3";return;}
 status.innerHTML="⏳ Subiendo Mi Conchita...";
 try{
  const name=Date.now()+"_"+mp3.name.replace(/[^a-z0-9.]/gi,'_');
  const {error:upErr}=await supabaseClient.storage.from('tracks').upload(name, mp3);
  if(upErr) throw upErr;
  const audio_url=supabaseClient.storage.from('tracks').getPublicUrl(name).data.publicUrl;
  let cover_url="";
  const cover=document.getElementById('cover').files[0];
  if(cover){
   const cname=Date.now()+"_c_"+cover.name.replace(/[^a-z0-9.]/gi,'_');
   await supabaseClient.storage.from('covers').upload(cname, cover);
   cover_url=supabaseClient.storage.from('covers').getPublicUrl(cname).data.publicUrl;
  }
  const {error:dbErr}=await supabaseClient.from('songs').insert([{title, artist:document.getElementById('artist').value, dedicated_to:document.getElementById('dedicated').value, genre:document.getElementById('genre').value, lyrics:document.getElementById('lyrics').value, audio_url, cover_url}]);
  if(dbErr) throw dbErr;
  status.innerHTML="✅ ¡Subido con éxito mi pez!";
  cargar();
 }catch(e){status.innerHTML="❌ "+e.message; console.error(e);}
}

async function cargar(){
 try{
  const {data,error}=await supabaseClient.from('songs').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  document.getElementById('count').innerText=data.length;
  const lista=document.getElementById('lista'); lista.innerHTML="";
  data.forEach(s=>{
   const wa=encodeURIComponent(`🎵 ${s.title} - EL DON 2035 🔥 ${s.audio_url}`);
   lista.innerHTML+=`<div class="song"><div><b style="color:#ffcc00">${s.title}</b><br><audio controls src="${s.audio_url}" style="width:250px"></audio><br><a target="_blank" href="https://wa.me/?text=${wa}" style="color:#25D366">📲 Compartir por WhatsApp</a></div></div>`;
  });
 }catch(e){document.getElementById('lista').innerHTML="Error: "+e.message}
}
cargar();
</script>
</body>
</html>
