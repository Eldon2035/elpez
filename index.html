function ocultarMenu(){document.getElementById('contextMenu').style.display='none';}
async function reintentarSubida(soloPortada=false){if(!selectedTemaId)return;ocultarMenu();let t=await obtenerTemaPorId(selectedTemaId);if(!t)return;let msg=document.getElementById('msg');msg.textContent="♻️ Reintentando '"+t.titulo+"'...";try{let portada_url="",cancion_url="";if(t.coverBlob){let nombreP=Date.now()+"_retry_portada_"+limpiarNombre(t.titulo+"_portada.jpg");let {error}=await supabaseClient.storage.from('portadas').upload(nombreP,t.coverBlob);if(!error){let {data}=supabaseClient.storage.from('portadas').getPublicUrl(nombreP);portada_url=data.publicUrl;}}if(!soloPortada && t.audioBlob){let nombreC=Date.now()+"_retry_"+limpiarNombre(t.titulo+".mp3");let {error}=await supabaseClient.storage.from('canciones').upload(nombreC,t.audioBlob);if(error) throw error;let {data}=supabaseClient.storage.from('canciones').getPublicUrl(nombreC);cancion_url=data.publicUrl;}if(soloPortada){let {data:existe}=await supabaseClient.from('canciones').select('*').eq('titulo',t.titulo).limit(1);if(existe && existe.length>0 && portada_url){await supabaseClient.from('canciones').update({portada_url:portada_url}).eq('id',existe[0].id);}else if(portada_url){await supabaseClient.from('canciones').insert([{artista:t.dedicado||'El Don 2035',titulo:t.titulo,letra:t.letra,portada_url,cancion_url:""}]);}}else{await supabaseClient.from('canciones').insert([{artista:t.dedicado||'El Don 2035',titulo:t.titulo,letra:t.letra,portada_url,cancion_url}]);}msg.textContent="¡Reintentado ONLINE! ✅ "+t.titulo;render();}catch(err){msg.textContent="Error al reintentar: "+err.message;}}
async function render(){let temas=await obtenerTemas();temas.sort((a,b)=>(a.orden||0)-(b.orden||0));let online=await cargarOnline();temasOnlineCache=online;let filtrar=t=>!filtro||(t.titulo+(t.dedicado||"")).toLowerCase().includes(filtro.toLowerCase());temas=temas.filter(filtrar);online=online.filter(filtrar);temasCache=temas;let l=document.getElementById("lista");l.innerHTML="";if(temas.length===0&&online.length===0)l.innerHTML='<div style="opacity:.6;text-align:center;padding:16px;font-size:14px;font-weight:600">No hay temas mi pez</div>';online.forEach((t,idx)=>{let urlC=t.portada_url||'logo.png';let btnBorrar=modoBorrado?`<button onclick="borrarTemaOnline('${t.id}')" style="background:#ff444422;border:1px solid #ff4444;color:#ff5555;border-radius:6px;padding:4px 6px">🗑️</button>`:"";let d=document.createElement("div");d.className="tema";d.style.borderColor="#00ff8822";d.innerHTML=`<img src="${urlC}" onclick="tocar(${idx},true)"><div style="flex:1;min-width:0" onclick="tocar(${idx},true)"><b style="color:#00ff88;font-size:14px">🌐 ${t.titulo}</b><div style="font-size:12px;opacity:.7">${t.dedicado||''} • ONLINE</div></div><button class="btn2" onclick="verLetra('${t.id}')">📜</button><button class="btn2" onclick="descargar('${t.id}')">⬇️</button><button class="btn2" onclick="compartir('${t.id}','${t.titulo}')">📲</button>${btnBorrar}`;l.appendChild(d);});temas.forEach((t,idx)=>{let urlC=t.coverBlob?URL.createObjectURL(t.coverBlob):'logo.png';let btnBorrar=modoBorrado?`<button onclick="borrarTema(${t.id})" style="background:#ff444422;border:1px solid #ff4444;color:#ff5555;border-radius:6px;padding:4px 6px">🗑️</button>`:"";let d=document.createElement("div");d.className="tema";if(idx===currentIdx)d.classList.add("playing");d.dataset.id=t.id;d.draggable=true;d.oncontextmenu=(e)=>mostrarMenu(e,t.id);d.innerHTML=`<img src="${urlC}" onclick="tocar(${idx})"><div style="flex:1;min-width:0" onclick="tocar(${idx})"><b style="background:linear-gradient(90deg,#FFD700,#FFE9A0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:14px">${t.fav?"❤️ ":""}${t.titulo} <span style="font-size:10px;opacity:.6">▶️${t.repro||0}</span></b><div style="font-size:12px;opacity:.7;color:#FFE9A0">${t.dedicado||''} • ${t.genero||''} • LOCAL</div></div><button class="btn2" onclick="verLetra(${t.id})">📜</button><button class="btn2" onclick="descargar(${t.id})">⬇️</button><button class="btn2" onclick="compartir(${t.id},'${t.titulo}')">📲</button>${btnBorrar}`;l.appendChild(d);});document.getElementById("contador").textContent=(await obtenerTemas()).length+online.length;document.getElementById("contador2").textContent=temas.length+online.length;}
function activarClave(){let a=Date.now();if(a-tiempoClick>3000)clicksLogo=0;tiempoClick=a;clicksLogo++;if(clicksLogo>=5){clicksLogo=0;let c=prompt("Clave secreta:");if(c===CLAVE){modoBorrado=true;alert("Borrado 60s ON");render();setTimeout(()=>{modoBorrado=false;render()},60000)}else if(c!==null)alert("Clave mala mi pez")}}
async function subir(){let ded=document.getElementById("dedicado").value.trim();let gen=document.getElementById("genero").value;let letra=document.getElementById("letra").value.trim();let f=document.getElementById("mp3").files[0];let c=document.getElementById("portada").files[0];if(!f){alert("Falta MP3 mi pez");return}let titulo=letra.split("\n")[0].substring(0,40).trim()||ded||f.name.replace(".mp3","")||"Mi Tema";let msg=document.getElementById("msg");msg.textContent="Subiendo online mi pez... espera";try{await guardarTema({titulo,dedicado:ded,genero:gen,letra,audioBlob:f,coverBlob:c||null,repro:0,orden:Date.now(),fav:false});let portada_url="",cancion_url="";if(c){let nombre=Date.now()+"_"+limpiarNombre(c.name);let {error}=await supabaseClient.storage.from('portadas').upload(nombre,c);if(error) throw error;let {data}=supabaseClient.storage.from('portadas').getPublicUrl(nombre);portada_url=data.publicUrl;}if(f){let nombre=Date.now()+"_"+limpiarNombre(f.name);let {error}=await supabaseClient.storage.from('canciones').upload(nombre,f);if(error) throw error;let {data}=supabaseClient.storage.from('canciones').getPublicUrl(nombre);cancion_url=data.publicUrl;}let {error:err2}=await supabaseClient.from('canciones').insert([{artista:ded||'El Don 2035',titulo,letra,portada_url,cancion_url}]);if(err2) throw err2;msg.textContent="¡Subido ONLINE para todos! ✅";document.getElementById("dedicado").value="";document.getElementById("letra").value="";render();}catch(e){console.error(e);msg.textContent="Error online: "+e.message+" (guardado local - click derecho para reintentar)";render();}}
abrirDB().then(()=>{
const pezCursor=document.getElementById('pezCursor');let mouseX=0,mouseY=0,cursorX=0,cursorY=0;document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;});(function animarCursor(){cursorX+=(mouseX-cursorX)*0.22;cursorY+=(mouseY-cursorY)*0.22;pezCursor.style.left=cursorX+'px';pezCursor.style.top=cursorY+'px';requestAnimationFrame(animarCursor);})();document.addEventListener('mousedown',()=>pezCursor.classList.add('playing'));document.addEventListener('mouseup',()=>pezCursor.classList.remove('playing'));document.querySelectorAll('button, .tema, .cover-wrap, input, select, textarea, .progress').forEach(el=>{el.addEventListener('mouseenter',()=>{pezCursor.textContent='🎵';pezCursor.classList.add('nota');});el.addEventListener('mouseleave',()=>{pezCursor.textContent='🐟';pezCursor.classList.remove('nota');});});
document.getElementById('ctxRetry').addEventListener('click',()=>reintentarSubida(false));document.getElementById('ctxRetryPortada').addEventListener('click',()=>reintentarSubida(true));document.getElementById('ctxVerLetra').addEventListener('click',()=>{ocultarMenu();verLetra(selectedTemaId);});document.getElementById('ctxCompartir').addEventListener('click',()=>{ocultarMenu();let t=temasCache.find(x=>x.id==selectedTemaId);if(t)compartir(t.id,t.titulo);});document.addEventListener('click',ocultarMenu);
actualizarFechas();setInterval(actualizarFechas,1000);
render();
let mainA=document.getElementById("mainAudio");
mainA.addEventListener("timeupdate",()=>{let pct=(mainA.currentTime/mainA.duration)*100;if(!isNaN(pct))document.getElementById("progressFill").style.width=pct+"%";document.getElementById("curTime").textContent=formatTime(mainA.currentTime);document.getElementById("durTime").textContent=formatTime(mainA.duration)});
mainA.addEventListener("ended",()=>{if(repeatMode==="one"){mainA.currentTime=0;mainA.play();return}let next=null;if(shuffle){next=Math.floor(Math.random()*temasCache.length)}else{next=currentIdx+1}if(next < temasCache.length){tocar(next)}else if(repeatMode==="all" && temasCache.length>0){tocar(0)}});
document.getElementById("progressBar").addEventListener("click",e=>{let rect=e.currentTarget.getBoundingClientRect();let pct=(e.clientX-rect.left)/rect.width;mainA.currentTime=pct*mainA.duration});
document.getElementById("logoBtn").addEventListener("click",activarClave);
document.getElementById("btnSubir").addEventListener("click",subir);
document.getElementById("buscador").addEventListener("input",e=>{filtro=e.target.value;render()});
document.getElementById("playBtn").addEventListener("click",()=>{if(mainA.paused){mainA.play();document.getElementById("playBtn").textContent="⏸️ PAUSA"}else{mainA.pause();document.getElementById("playBtn").textContent="▶️ PLAY"}});
document.getElementById("modeBtn").addEventListener("click",function(){repeatMode=repeatMode==="all"?"one":"all";this.textContent=repeatMode==="all"?"♾️ TODO":"🔂 UNA"});
document.getElementById("shuffleBtn").addEventListener("click",function(){shuffle=!shuffle;this.textContent=shuffle?"🔀 ON":"🔀 OFF"});
document.getElementById("volBtn").addEventListener("click",function(){volumen=volumen>0.5?0.3:1;mainA.volume=volumen;this.textContent=volumen>0.5?"🔊 100%":"🔉 30%"});
document.getElementById("nextBtn").addEventListener("click",()=>{let n=currentIdx+1;if(n>=temasCache.length)n=0;tocar(n)});
document.getElementById("prevBtn").addEventListener("click",()=>{let p=currentIdx-1;if(p<0)p=temasCache.length-1;tocar(p)});
document.getElementById("favBtn").addEventListener("click",()=>{if(temasCache.length===0)return;let t=temasCache[currentIdx];let tx=db.transaction("temas","readwrite");let req=tx.objectStore("temas").get(t.id);req.onsuccess=()=>{let tt=req.result;tt.fav=!tt.fav;tx.objectStore("temas").put(tt);document.getElementById("favBtn").textContent=tt.fav?"❤️":"🤍";render(false)}});
document.getElementById("btnFiesta").addEventListener("click",()=>{document.querySelector(".cover-wrap").requestFullscreen?.()});
document.getElementById("btnExport").addEventListener("click",async()=>{let temas=await obtenerTemas();if(temas.length===0){alert("No hay temas");return}let out=[];for(let t of temas){let buf=await t.audioBlob.arrayBuffer();let b64=btoa(String.fromCharCode(...new Uint8Array(buf)));let coverB64=null;if(t.coverBlob){let b2=await t.coverBlob.arrayBuffer();coverB64=btoa(String.fromCharCode(...new Uint8Array(b2)))}out.push({titulo:t.titulo,dedicado:t.dedicado,genero:t.genero,letra:t.letra,repro:t.repro,fav:t.fav,audioB64:b64,coverB64})}let blob=new Blob([JSON.stringify(out)],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="respaldo-pez-"+Date.now()+".json";a.click()});
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",async e=>{let file=e.target.files[0];if(!file)return;let txt=await file.text();let arr=JSON.parse(txt);for(let o of arr){let audioBlob=new Blob([Uint8Array.from(atob(o.audioB64),c=>c.charCodeAt(0))],{type:"audio/mpeg"});let coverBlob=o.coverB64?new Blob([Uint8Array.from(atob(o.coverB64),c=>c.charCodeAt(0))],{type:"image/jpeg"}):null;await guardarTema({titulo:o.titulo,dedicado:o.dedicado,genero:o.genero,letra:o.letra,repro:o.repro||0,fav:o.fav||false,orden:Date.now(),audioBlob,coverBlob})}render();alert("Importado "+arr.length+" temas mi pez")});
});
</script>
